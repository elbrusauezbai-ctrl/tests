р, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null}],"image":null},{"id":261,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Ауыр жұмыстар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Ауыр жұмыстар: ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","variants":[{"text":"Ауыр жұмыстар: ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","image":null},{"text":"Жеке қорғану құралдары: адамның ағзасын өндірістік ортаның қауіпті және зиянды факторларының әсерінен қорғауға арналған арнайы құралдар мен бұйымдар. Олар жұмысшының денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға мүмкіндік береді.","image":null},{"text":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null}],"image":null},{"id":262,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Психофизиологиялық факторлар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","variants":[{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Жұмыс аймағы: жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Мемлекеттік және ішкі бақылаудың ортақ мақсаты: жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"Комиссия құрамының негізгі қағидасы: тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null}],"image":null},{"id":263,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбек гигиенасы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","variants":[{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"Шеткі жарықтандыру: жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"Алдын алу: еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null},{"text":"Г категориясы: жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null},{"text":"Өздігінен тұтану: сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":264,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Химиялық тежеу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Химиялық тежеу: арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","variants":[{"text":"Химиялық тежеу: арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","image":null},{"text":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"Мемлекеттік бақылау: еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","image":null}],"image":null},{"id":265,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жазатайым оқиға» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жазатайым оқиға: қызметкердің еңбек міндеттерін орындау барысында немесе жұмыс берушінің тапсырмасын орындау кезінде денсаулығына зиян келуіне, жарақат алуына, еңбекке қабілеттілігін жоғалтуына немесе қайтыс болуына алып келген оқиға.","variants":[{"text":"Жазатайым оқиға: қызметкердің еңбек міндеттерін орындау барысында немесе жұмыс берушінің тапсырмасын орындау кезінде денсаулығына зиян келуіне, жарақат алуына, еңбекке қабілеттілігін жоғалтуына немесе қайтыс болуына алып келген оқиға.","image":null},{"text":"Демалыс: жұмыскердің еңбек міндеттерін орындаудан босатылып, тынығуына немесе әлеуметтік мақсаттарына арналған уақыт.","image":null},{"text":"Қадам кернеуі: адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","image":null},{"text":"Эргономика: адамның еңбек әрекеті мен жұмыс ортасының өзара үйлесімділігін зерттейтін сала. ЖҚҚ-ның эргономикалық қасиеттері оның жұмысшыға қаншалықты ыңғайлы, қауіпсіз және тиімді екенін сипаттайды.","image":null},{"text":"Еңбек дауы: жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null}],"image":null},{"id":266,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Шудан қорғауда ең тиімді тәсіл» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","variants":[{"text":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"Мұндай істердің мақсаты: оқиғаның барлық себептерін жан-жақты зерттеу және еңбек қауіпсіздігі талаптарының бұзылуына жол берген себептерді анықтау.","image":null},{"text":"Бақылаудың барлық түрлерінің ортақ мақсаты: жұмыскердің өмірі мен денсаулығын қорғау.","image":null},{"text":"Еңбекті қорғауды басқару жүйесі (ЕҚБЖ): кәсіпорындағы еңбек қауіпсіздігі мен еңбекті қорғауды жоспарлау, ұйымдастыру, бақылау және жетілдіру бойынша өзара байланысты шаралар жиынтығы.","image":null}],"image":null},{"id":267,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Күзеттік жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Күзеттік жарықтандыру: өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","variants":[{"text":"Күзеттік жарықтандыру: өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null},{"text":"Аралас жарықтандыру: жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","image":null},{"text":"Өндірістік ортаның метеорологиялық жағдайы немесе микроклиматы: жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","image":null},{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null},{"text":"Еңбек өтілі: жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null}],"image":null},{"id":268,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өрт хабарлағыш жүйесі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өрт хабарлағыш жүйесі: өрт белгілерін анықтауға, ақпаратты қабылдауға және адамдарға немесе басқару жүйелеріне өрт туралы хабар беруге арналған техникалық құралдар жиынтығы.","variants":[{"text":"Өрт хабарлағыш жүйесі: өрт белгілерін анықтауға, ақпаратты қабылдауға және адамдарға немесе басқару жүйелеріне өрт туралы хабар беруге арналған техникалық құралдар жиынтығы.","image":null},{"text":"Зиянды өндірістік фактор: жұмыскерге ұзақ немесе жүйелі түрде әсер ету нәтижесінде оның денсаулығының нашарлауына, кәсіптік аурудың пайда болуына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты: жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"Қорғаныстық жерге тұйықтау: қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null},{"text":"Гомогенді жану: жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null}],"image":null},{"id":269,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Электр доғасы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Электр доғасы: электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","variants":[{"text":"Электр доғасы: электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","image":null},{"text":"Зиянды еңбек жағдайлары: жұмыскердің денсаулығына, еңбекке қабілеттілігіне кері әсер етуі мүмкін өндірістік жағдайлар.","image":null},{"text":"Еңбек инспекциясының негізгі бағыттары: мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","image":null},{"text":"Д категориясы: жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","image":null},{"text":"Олардың артықшылығы: қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null}],"image":null},{"id":270,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Салауатты және қауіпсіз еңбек жағдайлары» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Салауатты және қауіпсіз еңбек жағдайлары: жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","variants":[{"text":"Салауатты және қауіпсіз еңбек жағдайлары: жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null},{"text":"Қала жағдайында шудың негізгі көздерінің бірі: автомобиль, теміржол және әуе көлігі.","image":null},{"text":"Мемлекеттік бақылаудың негізгі мақсаты: жазалау ғана емес, еңбек заңнамасының бұзылуының және жазатайым оқиғалардың алдын алу.","image":null},{"text":"Табиғи жарықтандырудың негізгі көзі: Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","image":null},{"text":"Өндірістік ортадағы еңбек жағдайын қалыптастыратын маңызды факторлардың бірі: жұмыс орнын дұрыс жарықтандыру. Жарықтандыру адамның көру қабілетіне, еңбек өнімділігіне, жұмыс сапасына және өндірістік қауіпсіздікке тікелей әсер етеді.","image":null}],"image":null},{"id":271,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Желдетудің негізгі мақсаты» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","variants":[{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Электр доғасы: электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","image":null},{"text":"Кәсіптік тәуекел: жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null},{"text":"Еңбекті қорғау: еңбек қызметі барысында жұмыскердің өмірі мен денсаулығын, қауіпсіздігін және еңбекке қабілеттілігін сақтауға бағытталған құқықтық, әлеуметтік-экономикалық, ұйымдық-техникалық, санитариялық-гигиеналық және емдік-профилактикалық шаралар жүйесі.","image":null},{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null}],"image":null},{"id":272,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жарақаттанудың алдын алудың басты мақсаты» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жарақаттанудың алдын алудың басты мақсаты: қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","variants":[{"text":"Жарақаттанудың алдын алудың басты мақсаты: қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","image":null},{"text":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау: еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу: еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null}],"image":null},{"id":273,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Демалыс» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Демалыс: жұмыскердің еңбек міндеттерін орындаудан босатылып, тынығуына немесе әлеуметтік мақсаттарына арналған уақыт.","variants":[{"text":"Демалыс: жұмыскердің еңбек міндеттерін орындаудан босатылып, тынығуына немесе әлеуметтік мақсаттарына арналған уақыт.","image":null},{"text":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"Оқшаулағыш костюмдердің негізгі мақсаты: адамды қауіпті немесе экстремалды қоршаған ортадан барынша оқшаулау.","image":null},{"text":"Тергеп-тексерудің басты мақсаты: оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null}],"image":null},{"id":274,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Статикалық жүктеме» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Статикалық жүктеме: адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","variants":[{"text":"Статикалық жүктеме: адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","image":null},{"text":"Салқындату: жанғыш заттың температурасын төмендету.","image":null},{"text":"Жанғыш ортаны азайту: жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"Тергеп-тексерудің басты мақсаты: оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null}],"image":null},{"id":275,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік санитария» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік санитария: зиянды өндірістік факторлардың жұмыскерлерге әсерін болдырмауға немесе олардың әсер ету деңгейін төмендетуге бағытталған санитариялық-гигиеналық, ұйымдастырушылық іс-шаралар мен техникалық құралдар жүйесі.","variants":[{"text":"Өндірістік санитария: зиянды өндірістік факторлардың жұмыскерлерге әсерін болдырмауға немесе олардың әсер ету деңгейін төмендетуге бағытталған санитариялық-гигиеналық, ұйымдастырушылық іс-шаралар мен техникалық құралдар жүйесі.","image":null},{"text":"Тұрақсыз шу: уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null}],"image":null},{"id":276,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өрт хабарлау жүйесі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өрт хабарлау жүйесі: өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","variants":[{"text":"Өрт хабарлау жүйесі: өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"Өндірістік санитария: зиянды өндірістік факторлардың жұмыскерлерге әсерін болдырмауға немесе олардың әсер ету деңгейін төмендетуге бағытталған санитариялық-гигиеналық, ұйымдастырушылық іс-шаралар мен техникалық құралдар жүйесі.","image":null},{"text":"Статикалық жүктеме: адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","image":null}],"image":null},{"id":277,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жазатайым оқиға орын алған кезде ең бірінші міндет» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","variants":[{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","image":null},{"text":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","image":null},{"text":"Еңбек инспекциясының негізгі бағыттары: мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","image":null},{"text":"Жазатайым оқиғаларды болдырмаудың ең тиімді жолы: олардың себептерін алдын ала анықтау.","image":null},{"text":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null}],"image":null},{"id":278,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","variants":[{"text":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","image":null},{"text":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"Жану: жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"Гомогенді жану: жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null}],"image":null},{"id":279,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Кезекші жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Кезекші жарықтандыру: жұмыс жүргізілмейтін уақытта ғимаратта қажетті ең төменгі жарық деңгейін қамтамасыз етеді.","variants":[{"text":"Кезекші жарықтандыру: жұмыс жүргізілмейтін уақытта ғимаратта қажетті ең төменгі жарық деңгейін қамтамасыз етеді.","image":null},{"text":"Өндірістік жарақаттанушылық: белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"Кәсіптік ауру: жұмыскерге еңбек қызметі барысында зиянды өндірістік факторлардың әсер етуінен туындаған ауру.","image":null},{"text":"Күзеттік жарықтандыру: өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null},{"text":"Еңбекті қорғау: еңбек қызметі барысында жұмыскердің өмірі мен денсаулығын, қауіпсіздігін және еңбекке қабілеттілігін сақтауға бағытталған құқықтық, әлеуметтік-экономикалық, ұйымдық-техникалық, санитариялық-гигиеналық және емдік-профилактикалық шаралар жүйесі.","image":null}],"image":null},{"id":280,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Эвакуация» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Эвакуация: өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","variants":[{"text":"Эвакуация: өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null},{"text":"Мемлекеттік еңбек инспекциясы: Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null},{"text":"Оның мақсаты: қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null},{"text":"Оның мақсаты: еңбек заңнамасы мен еңбек қауіпсіздігі талаптарының орындалуын қамтамасыз ету.","image":null},{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","image":null}],"image":null},{"id":281,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Электр қауіпсіздігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Электр қауіпсіздігі: электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","variants":[{"text":"Электр қауіпсіздігі: электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","image":null},{"text":"Стробоскопиялық әсер: периодты түрде өзгеріп тұратын жарық әсерінен қозғалыстағы немесе айналып тұрған бөлшектің қозғалысы көзге баяулаған, тоқтап тұрған немесе басқа бағытта қозғалып жатқандай көрінетін құбылыс.","image":null},{"text":"Мемлекеттік бақылау: еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","image":null},{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Аралас жарықтандыру: жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","image":null}],"image":null},{"id":282,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты: жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","variants":[{"text":"Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты: жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу: еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"Блокировка: қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","image":null},{"text":"Тұрақты шу: жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"Еңбек дауы: жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null}],"image":null},{"id":283,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жұмыс аймағы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жұмыс аймағы: жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","variants":[{"text":"Жұмыс аймағы: жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null},{"text":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"Гетерогенді жану: жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты: жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null}],"image":null},{"id":284,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Кәсіптік тәуекел» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Кәсіптік тәуекел: еңбек қызметі кезінде жұмыскердің денсаулығына зиян келу ықтималдығы.","variants":[{"text":"Кәсіптік тәуекел: еңбек қызметі кезінде жұмыскердің денсаулығына зиян келу ықтималдығы.","image":null},{"text":"Қауіпсіздік мәдениеті: ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"Еңбек дауы: жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null},{"text":"Жұмыс уақыты: жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"Өздігінен тұтану: сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":285,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбек гигиенасы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға және өндірістік ортаның жағымсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар жүйесі.","variants":[{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға және өндірістік ортаның жағымсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар жүйесі.","image":null},{"text":"Оның маңызды ерекшелігі: барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","image":null},{"text":"Тұтану: тұтандыру көзінің әсерінен жанудың басталуы.","image":null},{"text":"Жұмыс берушінің негізгі міндеттерінің бірі: тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"Кәсіптік тәуекел: жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null}],"image":null},{"id":286,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Динамикалық жүктеме» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Динамикалық жүктеме: қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","variants":[{"text":"Динамикалық жүктеме: қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","image":null},{"text":"Жану: жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"Жұмыс берушінің негізгі міндеттерінің бірі: тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"Стробоскопиялық әсер: периодты түрде өзгеріп тұратын жарық әсерінен қозғалыстағы немесе айналып тұрған бөлшектің қозғалысы көзге баяулаған, тоқтап тұрған немесе басқа бағытта қозғалып жатқандай көрінетін құбылыс.","image":null},{"text":"Химиялық тежеу: арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","image":null}],"image":null},{"id":287,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","variants":[{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"Д категориясы: жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","image":null},{"text":"Гомогенді жану: жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"Негізгі мақсат: қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"Салқындату: жанғыш заттың температурасын төмендету.","image":null}],"image":null},{"id":288,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өрт қауіпсіздігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өрт қауіпсіздігі: еңбекті қорғаудың маңызды бағыттарының бірі. Оның басты мақсаты – өрттің алдын алу, ал өрт туындаған жағдайда адамдардың өмірі мен денсаулығын қорғау және материалдық шығынды барынша азайту.","variants":[{"text":"Өрт қауіпсіздігі: еңбекті қорғаудың маңызды бағыттарының бірі. Оның басты мақсаты – өрттің алдын алу, ал өрт туындаған жағдайда адамдардың өмірі мен денсаулығын қорғау және материалдық шығынды барынша азайту.","image":null},{"text":"Өндірістік жарақаттанушылық: белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"Өндірістік кеңес: жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Жарқ ету: жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null}],"image":null},{"id":289,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жұмыс берушінің негізгі міндеттерінің бірі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жұмыс берушінің негізгі міндеттерінің бірі: тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","variants":[{"text":"Жұмыс берушінің негізгі міндеттерінің бірі: тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"Статикалық жүктеме: адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","image":null},{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null},{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null}],"image":null},{"id":290,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Дыбыс жиілігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","variants":[{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null},{"text":"Қорғаныстық жерге тұйықтау: қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null},{"text":"Жану: жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Статикалық электр: материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null}],"image":null},{"id":291,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Стробоскопиялық әсер» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Стробоскопиялық әсер: периодты түрде өзгеріп тұратын жарық әсерінен қозғалыстағы немесе айналып тұрған бөлшектің қозғалысы көзге баяулаған, тоқтап тұрған немесе басқа бағытта қозғалып жатқандай көрінетін құбылыс.","variants":[{"text":"Стробоскопиялық әсер: периодты түрде өзгеріп тұратын жарық әсерінен қозғалыстағы немесе айналып тұрған бөлшектің қозғалысы көзге баяулаған, тоқтап тұрған немесе басқа бағытта қозғалып жатқандай көрінетін құбылыс.","image":null},{"text":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","image":null},{"text":"Өндірістік зияндылықтар: өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null},{"text":"Комиссия құрамының негізгі қағидасы: тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null}],"image":null},{"id":292,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өрт байқалған жағдайда ең басты міндет» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өрт байқалған жағдайда ең басты міндет: адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","variants":[{"text":"Өрт байқалған жағдайда ең басты міндет: адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","image":null},{"text":"Қауіпсіздік мәдениеті: ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"Қорғаныстық жерге тұйықтау: қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null}],"image":null},{"id":293,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Қорғаныстық жерге тұйықтау» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Қорғаныстық жерге тұйықтау: қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","variants":[{"text":"Қорғаныстық жерге тұйықтау: қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null},{"text":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Эвакуациялық жарықтандыру: апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","image":null}],"image":null},{"id":294,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Кәсіптік тәуекел» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Кәсіптік тәуекел: жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","variants":[{"text":"Кәсіптік тәуекел: жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null},{"text":"Эвакуация: өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null},{"text":"Комиссия құрамының негізгі қағидасы: тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null},{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Өрттің алдын алу: өрт қауіпсіздігінің ең маңызды бағыты.","image":null}],"image":null},{"id":295,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Табиғи желдету» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Табиғи желдету: бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","variants":[{"text":"Табиғи желдету: бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","image":null},{"text":"Алдын алу: еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелде насының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null}],"image":null},{"id":299,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік зияндылықтар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік зияндылықтар: өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","variants":[{"text":"Өндірістік зияндылықтар: өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null}],"image":null},{"id":300,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Ең маңызды қағида» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","variants":[{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"Нөлдеу: электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"Жазатайым оқиғаларды болдырмаудың ең ти const BLOCK_SIZE = 25;
const TOTAL_BLOCKS = Math.ceil(quizData.length / BLOCK_SIZE);
let currentQuestions = [], currentIndex = 0, score = 0, userAnswers = [], enterHandler = null;

function toggleDarkMode(){ document.body.classList.toggle('dark'); }
function enableEnterToNext(){
  if (enterHandler) document.removeEventListener('keydown', enterHandler);
  enterHandler = function(e){
    if (e.key === 'Enter'){
      const btn = document.getElementById('next-btn');
      if (btn && !btn.classList.contains('hidden')){ e.preventDefault(); loadNextQuestion(); }
    }
  };
  document.addEventListener('keydown', enterHandler);
}
function buildBlockButtons(){
  const c = document.getElementById('block-list'); c.innerHTML = '';
  for (let i = 0; i < TOTAL_BLOCKS; i++){
    const s = i*BLOCK_SIZE+1, e = Math.min((i+1)*BLOCK_SIZE, quizData.length);
    const b = document.createElement('button'); b.textContent = `${s} - ${e}`; b.onclick = () => initQuiz(i); c.appendChild(b);
  }
}
function initQuiz(bi){
  const s = bi*BLOCK_SIZE, e = Math.min(s+BLOCK_SIZE, quizData.length);
  currentQuestions = [];
  for (let i = s; i < e; i++){
    const q = quizData[i];
    currentQuestions.push({id:q.id, text:q.question, correct:q.correct, variants:[...q.variants].sort(()=>Math.random()-.5), image:q.image||null});
  }
  for (let i = currentQuestions.length-1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentQuestions[i], currentQuestions[j]] = [currentQuestions[j], currentQuestions[i]];
  }
  currentIndex = 0; score = 0; userAnswers = new Array(currentQuestions.length).fill(null);
  document.getElementById('home-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  showQuestion(); enableEnterToNext();
}
function openModal(src){ document.getElementById('imageModal').style.display='flex'; document.getElementById('modalImg').src=src; }
document.querySelector('.close-modal').onclick = () => document.getElementById('imageModal').style.display='none';
window.onclick = e => { if (e.target === document.getElementById('imageModal')) document.getElementById('imageModal').style.display='none'; };
function showQuestion(){
  const q = currentQuestions[currentIndex];
  document.getElementById('q-text').innerText = q.text;
  document.getElementById('progress-text').innerText = `Сұрақ: ${currentIndex+1}/${currentQuestions.length}`;
  const ic = document.getElementById('question-image-container'); ic.innerHTML = '';
  if (q.image){
    const d = document.createElement('div'); d.className='question-image';
    const im = document.createElement('img'); im.src=q.image; im.onclick=()=>openModal(q.image);
    d.appendChild(im); ic.appendChild(d);
  }
  const c = document.getElementById('options-list'); c.innerHTML = '';
  const saved = userAnswers[currentIndex];
  q.variants.forEach(v => {
    const d = document.createElement('div'); d.className='option-item';
    if (v.image){
      const im = document.createElement('img'); im.src=v.image; im.className='option-img';
      im.onclick = e => { e.stopPropagation(); openModal(v.image); };
      d.appendChild(im);
    }
    const sp = document.createElement('span'); sp.className='option-text'; sp.innerText=v.text; d.appendChild(sp);
    d.dataset.text = v.text;
    if (saved !== null){
      if (v.text === q.correct) d.classList.add('correct'); else if (v.text === saved) d.classList.add('wrong');
      d.style.pointerEvents='none';
    } else d.onclick = () => checkAnswer(d, v.text, q.correct);
    c.appendChild(d);
  });
  const nb = document.getElementById('next-btn');
  if (saved !== null) nb.classList.remove('hidden'); else nb.classList.add('hidden');
  enableEnterToNext();
}
function checkAnswer(el, sel, cor){
  const all = document.querySelectorAll('.option-item');
  all.forEach(o => o.style.pointerEvents='none');
  if (sel === cor){ el.classList.add('correct'); score++; }
  else { el.classList.add('wrong'); all.forEach(o => { if (o.dataset.text === cor) o.classList.add('correct'); }); }
  userAnswers[currentIndex] = sel;
  document.getElementById('next-btn').classList.remove('hidden');
  enableEnterToNext();
}
function loadNextQuestion(){ if (currentIndex+1 < currentQuestions.length){ currentIndex++; showQuestion(); } else showResults(); }
function showResults(){
  if (enterHandler){ document.removeEventListener('keydown', enterHandler); enterHandler=null; }
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('final-score').innerText = `${score}/${currentQuestions.length}`;
  const p = score/currentQuestions.length*100;
  document.getElementById('result-message').innerText = p>=90?'Тамаша!':p>=70?'Жақсы!':p>=50?'Орташа':'Қайталаңыз';
  const dd = document.getElementById('result-details'); dd.innerHTML = '<h4>Сұрақтар бойынша нәтиже:</h4>';
  currentQuestions.forEach((q, i) => {
    const ok = userAnswers[i] === q.correct;
    const d = document.createElement('div'); d.className='detail-item';
    const b = document.createElement('b'); b.textContent = (i+1)+'. ';
    const t = document.createTextNode(q.text.substring(0,80)+'... ');
    const s = document.createElement('span'); s.className = ok?'detail-correct':'detail-wrong'; s.textContent = ok?'✓ Дұрыс':'✗ Бұрыс';
    const br = document.createElement('br'); const sm = document.createElement('small'); sm.textContent = 'Дұрыс жауап: '+q.correct;
    d.append(b,t,s,br,sm); dd.appendChild(d);
  });
  const rb = document.getElementById('retry-wrong-btn'); rb.classList.remove('hidden'); rb.onclick = retryWrongQuestions;
}
function retryWrongQuestions(){
  const wrong = currentQuestions.filter((q,i) => userAnswers[i] !== q.correct);
  if (!wrong.length){ alert('Барлық жауаптар дұрыс!'); return; }
  currentQuestions = wrong.map(q => ({...q, variants:[...q.variants].sort(()=>Math.random()-.5)}));
  currentIndex = 0; score = 0; userAnswers = new Array(currentQuestions.length).fill(null);
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  showQuestion(); enableEnterToNext();
}
function restartQuiz(){
  if (enterHandler){ document.removeEventListener('keydown', enterHandler); enterHandler=null; }
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('home-screen').classList.remove('hidden');
}
document.getElementById('next-btn').onclick = loadNextQuestion;
buildBlockButtons();
</script>
</body>
</html>
