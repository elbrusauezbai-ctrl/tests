<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q-Tion | Суретті тест</title>
<style>
:root{--bg:#f8fafc;--primary:#3b82f6;--white:#fff;--text:#1e293b;--success:#22c55e;--error:#ef4444;--shadow:0 10px 25px rgba(0,0,0,.05)}
body.dark{--bg:#0f172a;--white:#1e293b;--text:#e2e8f0;--shadow:0 10px 25px rgba(0,0,0,.3)}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
.app-container{max-width:800px;margin:40px auto;padding:20px}
.hidden{display:none}
.screen{animation:fadeIn .3s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
header{text-align:center;margin-bottom:40px}
header h1{background:linear-gradient(135deg,#3b82f6,#1e40af);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:3rem;letter-spacing:-1px;margin:0}
header p{color:#64748b}
.menu-card,.result-card{background:var(--white);padding:40px;border-radius:32px;box-shadow:var(--shadow)}
.grid-menu{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
button{padding:14px 18px;border:none;border-radius:24px;background:var(--primary);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
button:hover{background:#2563eb;transform:translateY(-2px);box-shadow:0 10px 20px rgba(59,130,246,.3)}
.option-item{background:var(--white);border-radius:24px;border:2px solid #e2e8f0;cursor:pointer;transition:.2s;overflow:hidden;padding:20px;margin-bottom:10px}
.option-item:hover{border-color:var(--primary);transform:translateX(4px)}
.option-img{width:100%;max-height:180px;object-fit:contain;border-radius:16px;margin-bottom:12px;background:#f1f5f9;padding:8px;cursor:pointer}
.option-text{font-size:1rem;font-weight:500;display:block;text-align:center}
.correct{background:#dcfce7!important;border-color:var(--success)!important;color:#166534}
.wrong{background:#fee2e2!important;border-color:var(--error)!important;color:#991b1b}
.question-image{margin:20px 0;text-align:center;background:#f1f5f9;padding:16px;border-radius:24px}
.question-image img{max-width:100%;max-height:320px;border-radius:16px;cursor:pointer}
.quiz-footer{margin-top:20px;text-align:center}
.contact-footer{margin-top:40px;padding-top:20px;border-top:1px solid #e2e8f0;text-align:center}
.contact-link{display:inline-block;font-size:1.2rem;font-weight:600;color:#3b82f6;text-decoration:none;margin:0 15px}
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.9);justify-content:center;align-items:center}
.modal-content{max-width:90%;max-height:90%;border-radius:16px}
.close-modal{position:absolute;top:20px;right:35px;color:#fff;font-size:40px;cursor:pointer}
.dark-toggle{position:fixed;top:20px;right:20px;background:var(--primary);border-radius:50%;width:50px;height:50px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);z-index:100;font-size:22px}
.score-circle{font-size:2rem;font-weight:700;margin:16px 0;text-align:center}
.result-details{margin-top:20px;max-height:400px;overflow-y:auto;text-align:left;background:var(--white);border-radius:16px;padding:15px}
.detail-item{padding:8px;border-bottom:1px solid #e2e8f0;font-size:14px}
.detail-correct{color:var(--success);font-weight:bold}
.detail-wrong{color:var(--error);font-weight:bold}
.result-card .button-group{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin:30px 0 20px}
.result-card .button-group button{border-radius:60px;padding:12px 28px;min-width:180px}
@media(max-width:550px){.result-card .button-group button{min-width:unset;width:100%;max-width:280px}}
</style>
</head>
<body>
<div class="dark-toggle" onclick="toggleDarkMode()">🌙</div>
<div id="imageModal" class="modal"><span class="close-modal">&times;</span><img class="modal-content" id="modalImg"></div>
<div class="app-container">
  <div id="home-screen" class="screen">
    <header><h1>Q-Tion</h1><p id="subt">Кәсіби деңгейдегі білім тексеру жүйесі</p></header>
    <div class="menu-card"><h3>Тест блогын таңдаңыз:</h3><div class="grid-menu" id="block-list"></div></div>
  </div>
  <div id="quiz-screen" class="screen hidden">
    <div class="quiz-header"><span id="progress-text"></span></div>
    <div id="question-box"><h2 id="q-text"></h2><div id="question-image-container"></div><div id="options-list"></div></div>
    <div class="quiz-footer"><button id="next-btn" class="hidden">Келесі сұрақ →</button></div>
  </div>
  <div id="result-screen" class="screen hidden">
    <div class="result-card">
      <h2>Тест аяқталды!</h2>
      <div class="score-circle"><span id="final-score">0</span></div>
      <p id="result-message"></p>
      <div class="button-group">
        <button id="retry-wrong-btn" class="hidden">Қате жауаптарды қайталау</button>
        <button onclick="restartQuiz()">Басты мәзірге оралу</button>
      </div>
      <div id="result-details" class="result-details"></div>
    </div>
  </div>
</div>
<div class="contact-footer"><p>Сұрақтар бойынша хабарласыңыз:</p><a href="https://www.instagram.com/prismwebq?igsh=ZWRlaDVtbHgwbTNl" target="_blank" class="contact-link">@prismwebq.kz</a><a href="tel:+77066772714" class="contact-link">+7 (706) 677-27-14</a></div>
<script>
const TEST_TITLE = "Охрана труда";
if (TEST_TITLE){ document.title = TEST_TITLE+' | Q-Tion'; document.getElementById('subt').textContent = TEST_TITLE; }

e":null},{"text":"Статикалық электр","image":null},{"text":"Жазатайым оқиғаларды болдырмаудың ең тиімді жолы","image":null},{"text":"Өндірістік санитарияның мақсаты","image":null},{"text":"Аралас жарықтандыру","image":null}],"image":null},{"id":5,"question":"Қай ұғымға сәйкес келеді: Қызметкердің еңбек міндеттерін орындау барысында немесе жұмыс берушінің тапсырмасын орындау кезінде денсаулығына зиян келуіне, жарақат алуына, еңбекке қабілеттілігін жоғалтуына немесе қайтыс болуына алып келген оқиға.","correct":"Жазатайым оқиға","variants":[{"text":"Жазатайым оқиға","image":null},{"text":"Қорғаныстық жерге тұйықтау","image":null},{"text":"Өндірістік санитария","image":null},{"text":"Еңбек өтілі","image":null},{"text":"Жанғыш ортаны азайту","image":null}],"image":null},{"id":6,"question":"Қай ұғымға сәйкес келеді: Дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","correct":"Дыбыс жиілігі","variants":[{"text":"Дыбыс жиілігі","image":null},{"text":"Салыстырмалы ылғалдылық","image":null},{"text":"Өндірістік жарақат","image":null},{"text":"Ең маңызды қағида","image":null},{"text":"Кезекші жарықтандыру","image":null}],"image":null},{"id":7,"question":"Қай ұғымға сәйкес келеді: Жұмыс орнын дұрыс жарықтандыру. Жарықтандыру адамның көру қабілетіне, еңбек өнімділігіне, жұмыс сапасына және өндірістік қауіпсіздікке тікелей әсер етеді.","correct":"Еңбек жағдайын қалыптастыратын маңызды факторлардың бірі","variants":[{"text":"Еңбек жағдайын қалыптастыратын маңызды факторлардың бірі","image":null},{"text":"Қауіпсіз еңбек жағдайын қамтамасыз етудің маңызды шараларының бірі","image":null},{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті","image":null},{"text":"Қала жағдайында шудың негізгі көздерінің бірі","image":null}],"image":null},{"id":8,"question":"Қай ұғымға сәйкес келеді: Өрттің пайда болу мүмкіндігін төмендетуге, ал өрт туындаған жағдайда адамдардың өмірі мен денсаул дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","variants":[{"text":"жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"жанғыш заттың температурасын төмендету.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null},{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null}],"image":null},{"id":104,"question":"«Ең кең таралған тотықтырғыш» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ауа құрамындағы оттегі. Кейбір заттардың жануы басқа тотықтырғыштардың қатысуымен де жүруі мүмкін.","variants":[{"text":"ауа құрамындағы оттегі. Кейбір заттардың жануы басқа тотықтырғыштардың қатысуымен де жүруі мүмкін.","image":null},{"text":"жұмыс орнын дұрыс жарықтандыру. Жарықтандыру адамның көру қабілетіне, еңбек өнімділігіне, жұмыс сапасына және өндірістік қауіпсіздікке тікелей әсер етеді.","image":null},{"text":"жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","image":null},{"text":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null}],"image":null},{"id":105,"question":"«Жұмыс берушінің негізгі міндеттерінің бірі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","variants":[{"text":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null},{"text":"жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын қорғау.","image":null},{"text":"жұмыскерді зиянды және қауіпті өндірістік факторлардан қорғауға арналған арнайы құралдар.","image":null}],"image":null},{"id":106,"question":"«Қала жағдайында шудың негізгі көздерінің бірі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"автомобиль, теміржол және әуе көлігі.","variants":[{"text":"автомобиль, теміржол және әуе көлігі.","image":null},{"text":"ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","image":null},{"text":"жұмыс жүргізілмейтін уақытта ғимаратта қажетті ең төменгі жарық деңгейін қамтамасыз етеді.","image":null},{"text":"жұмыскерге ұзақ немесе жүйелі түрде әсер ету нәтижесінде оның денсаулығының нашарлауына, кәсіптік аурудың пайда болуына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null}],"image":null},{"id":107,"question":"«Табиғи жарықтандырудың негізгі көзі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","variants":[{"text":"Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","image":null},{"text":"адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null},{"text":"қауіпті жағдайларды жазатайым оқиға болғанға дейін анықтау және жою.","image":null},{"text":"өрт белгілерін анықтауға, ақпаратты қабылдауға және адамдарға немесе басқару жүйелеріне өрт туралы хабар беруге арналған техникалық құралдар жиынтығы.","image":null}],"image":null},{"id":108,"question":"«Тұтану» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"тұтандыру көзінің әсерінен жанудың басталуы.","variants":[{"text":"тұтандыру көзінің әсерінен жанудың басталуы.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға және өндірістік ортаның жағымсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар жүйесі.","image":null},{"text":"өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"жұмыс берушінің негізгі міндеттерінің бірі.","image":null},{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null}],"image":null},{"id":109,"question":"«Оның мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","variants":[{"text":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null},{"text":"жұмыскерге әсер етуі оның жарақат алуына, еңбекке қабілеттілігін уақытша немесе тұрақты жоғалтуына немесе ауыр жағдайда өлімге әкелуі мүмкін өндірістік фактор.","image":null},{"text":"әсер ету нәтижесінде жұмыскердің ауруына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","image":null},{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null}],"image":null},{"id":110,"question":"«Мемлекеттік бақылау» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","variants":[{"text":"еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","image":null},{"text":"өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"дыбыс деңгейін сипаттайтын салыстырмалы өлшем бірлігі. Шу деңгейін анықтау үшін арнайы шумомер (шу өлшегіш) қолданылады.","image":null},{"text":"еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null}],"image":null},{"id":111,"question":"«Жұмыс аймағы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","variants":[{"text":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"қауіпті жағдайларды жазатайым оқиға болғанға дейін анықтау және жою.","image":null},{"text":"жұмыс берушінің негізгі міндеттерінің бірі.","image":null}],"image":null},{"id":112,"question":"«Өндірістік жарақаттанушылық» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","variants":[{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","image":null},{"text":"жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"еңбек қызметі барысында жұмыскердің өмірі мен денсаулығын, қауіпсіздігін және еңбекке қабілеттілігін сақтауға бағытталған құқықтық, әлеуметтік-экономикалық, ұйымдық-техникалық, санитариялық-гигиеналық және емдік-профилактикалық шаралар жүйесі.","image":null}],"image":null},{"id":113,"question":"«Мемлекеттік бақылаудың негізгі мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жазалау ғана емес, еңбек заңнамасының бұзылуының және жазатайым оқиғалардың алдын алу.","variants":[{"text":"жазалау ғана емес, еңбек заңнамасының бұзылуының және жазатайым оқиғалардың алдын алу.","image":null},{"text":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null},{"text":"жұмыскерге әсер етуі оның жарақат алуына, еңбекке қабілеттілігін уақытша немесе тұрақты жоғалтуына немесе ауыр жағдайда өлімге әкелуі мүмкін өндірістік фактор.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null}],"image":null},{"id":114,"question":"«Химиялық факторлар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"өндірісте қолданылатын немесе технологиялық процесс барысында пайда болатын химиялық заттардың адам ағзасына зиянды әсер етуімен байланысты факторлар.","variants":[{"text":"өндірісте қолданылатын немесе технологиялық процесс барысында пайда болатын химиялық заттардың адам ағзасына зиянды әсер етуімен байланысты факторлар.","image":null},{"text":"дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","image":null}],"image":null},{"id":115,"question":"«Өндірістік зияндылықтар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","variants":[{"text":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"жұмыскердің денсаулығына, еңбекке қабілеттілігіне кері әсер етуі мүмкін өндірістік жағдайлар.","image":null},{"text":"жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null}],"image":null},{"id":116,"question":"«Гомогенді жану» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","variants":[{"text":"жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"ағзаның улануына және мүшелер қызметінің бұзылуына әкелуі мүмкін.","image":null},{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null},{"text":"қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","image":null}],"image":null},{"id":117,"question":"«Комиссия құрамының негізгі қағидасы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","variants":[{"text":"тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null},{"text":"жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім. Ол жұмыскердің атқаратын қызметін, еңбек жағдайларын, еңбекақысын және тараптардың міндеттерін белгілейді.","image":null},{"text":"дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","image":null}],"image":null},{"id":118,"question":"«Тұрақты шу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","variants":[{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null},{"text":"жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"олардың себептерін алдын ала анықтау.","image":null},{"text":"жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null}],"image":null},{"id":119,"question":"«Шеткі жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","variants":[{"text":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"жұмыскерге әсер етуі оның жарақат алуына, еңбекке қабілеттілігін уақытша немесе тұрақты жоғалтуына немесе ауыр жағдайда өлімге әкелуі мүмкін өндірістік фактор.","image":null},{"text":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null}],"image":null},{"id":120,"question":"«Өздігінен тұтану» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","variants":[{"text":"сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null},{"text":"Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null},{"text":"жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"қауіпсіз және өнімді еңбек жағдайларын қалыптастыратын негізгі өндірістік факторлардың бірі.","image":null},{"text":"заттардың тотықтырғышпен әрекеттесуі нәтижесінде жылу және көбінесе жарық бөлінуімен жүретін күрделі физика-химиялық процесс.","image":null}],"image":null},{"id":121,"question":"«Нөлдеу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","variants":[{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"адамның еңбек әрекеті мен жұмыс ортасының өзара үйлесімділігін зерттейтін сала. ЖҚҚ-ның эргономикалық қасиеттері оның жұмысшыға қаншалықты ыңғайлы, қауіпсіз және тиімді екенін сипаттайды.","image":null},{"text":"жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"зиянды өндірістік факторлардың жұмыскер денсаулығына әсерін болдырмау немесе төмендету.","image":null}],"image":null},{"id":122,"question":"«Алдын алу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","variants":[{"text":"еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null},{"text":"еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","image":null},{"text":"жұмыс орнын мүмкіндігінше қатты жарықтандыру емес, орындалатын жұмысқа сәйкес қауіпсіз, жеткілікті, біркелкі және көзге жайлы жарық ортасын қалыптастыру.","image":null},{"text":"жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","image":null},{"text":"ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","image":null}],"image":null},{"id":123,"question":"«Табиғи желдету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","variants":[{"text":"бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","image":null},{"text":"өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null}],"image":null},{"id":124,"question":"«Жарақаттанудың алдын алудың басты мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","variants":[{"text":"қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","image":null},{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"автомобиль, теміржол және әуе көлігі.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null}],"image":null},{"id":125,"question":"«Жұмыс орнында қауіпсіз жағдай жасау» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс берушінің негізгі міндеттерінің бірі.","variants":[{"text":"жұмыс берушінің негізгі міндеттерінің бірі.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтауға бағытталған кешенді жүйе. Қауіпсіз еңбек жағдайын қалыптастыру үшін жұмыс беруші қажетті техникалық және ұйымдық шараларды орындауы, ал жұмыскер белгіленген қауіпсіздік талаптарын сақтауы қажет.","image":null},{"text":"жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null},{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null}],"image":null},{"id":126,"question":"«Улы заттар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ағзаның улануына және мүшелер қызметінің бұзылуына әкелуі мүмкін.","variants":[{"text":"ағзаның улануына және мүшелер қызметінің бұзылуына әкелуі мүмкін.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","image":null},{"text":"пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null}],"image":null},{"id":127,"question":"«Өндірістік ортаның метеорологиялық жағдайы немесе микроклиматы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","variants":[{"text":"жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","image":null},{"text":"пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","image":null},{"text":"жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null},{"text":"жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null}],"image":null},{"id":128,"question":"«Гетерогенді жану» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","variants":[{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"ағзаның улануына және мүшелер қызметінің бұзылуына әкелуі мүмкін.","image":null},{"text":"адамның ағзасын өндірістік ортаның қауіпті және зиянды факторларының әсерінен қорғауға арналған арнайы құралдар мен бұйымдар. Олар жұмысшының денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға мүмкіндік береді.","image":null},{"text":"өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"адамның еңбек әрекеті мен жұмыс ортасының өзара үйлесімділігін зерттейтін сала. ЖҚҚ-ның эргономикалық қасиеттері оның жұмысшыға қаншалықты ыңғайлы, қауіпсіз және тиімді екенін сипаттайды.","image":null}],"image":null},{"id":129,"question":"«Мұндай істердің мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"оқиғаның барлық себептерін жан-жақты зерттеу және еңбек қауіпсіздігі талаптарының бұзылуына жол берген себептерді анықтау.","variants":[{"text":"оқиғаның барлық себептерін жан-жақты зерттеу және еңбек қауіпсіздігі талаптарының бұзылуына жол берген себептерді анықтау.","image":null},{"text":"жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null},{"text":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null}],"image":null},{"id":130,"question":"«Тұрақсыз шу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","variants":[{"text":"уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындаудан босатылып, тынығуына немесе әлеуметтік мақсаттарына арналған уақыт.","image":null},{"text":"жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"жұмыскерлерді еңбек қауіпсіздігі бойынша оқыту.","image":null}],"image":null},{"id":131,"question":"«Жоғарғы жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","variants":[{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"жазалау ғана емес, еңбек заңнамасының бұзылуының және жазатайым оқиғалардың алдын алу.","image":null},{"text":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null}],"image":null},{"id":132,"question":"«Жарқ ету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","variants":[{"text":"жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null},{"text":"қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null},{"text":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null}],"image":null},{"id":133,"question":"«Блокировка» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","variants":[{"text":"қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","image":null},{"text":"жарықтандырылу (E). Оның өлшем бірлігі – люкс (лк).","image":null},{"text":"бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null}],"image":null},{"id":134,"question":"«Тергеп-тексерудің басты мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","variants":[{"text":"оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null}],"image":null},{"id":135,"question":"«Табиғи желдетудің қарапайым түрі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"терезелер, фрамугалар және арнайы желдету саңылаулары арқылы ауа алмасу.","variants":[{"text":"терезелер, фрамугалар және арнайы желдету саңылаулары арқылы ауа алмасу.","image":null},{"text":"барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","image":null},{"text":"өрт белгілерін анықтауға, ақпаратты қабылдауға және адамдарға немесе басқару жүйелеріне өрт туралы хабар беруге арналған техникалық құралдар жиынтығы.","image":null},{"text":"жұмыскерге ұзақ немесе жүйелі түрде әсер ету нәтижесінде оның денсаулығының нашарлауына, кәсіптік аурудың пайда болуына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null}],"image":null},{"id":136,"question":"«Кәсіптік тәуекел» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"еңбек қызметі кезінде жұмыскердің денсаулығына зиян келу ықтималдығы.","variants":[{"text":"еңбек қызметі кезінде жұмыскердің денсаулығына зиян келу ықтималдығы.","image":null},{"text":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","image":null},{"text":"адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","image":null},{"text":"еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null}],"image":null},{"id":137,"question":"«Қауіпті өндірістік фактор» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","variants":[{"text":"белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null},{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null},{"text":"өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":138,"question":"«Тітіркендіргіш заттар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","variants":[{"text":"көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","image":null},{"text":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"қалыпты өндірістік процесті қамтамасыз етеді.","image":null}],"image":null},{"id":139,"question":"«Ауа температурасы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","variants":[{"text":"өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null},{"text":"жұмыс орнын мүмкіндігінше қатты жарықтандыру емес, орындалатын жұмысқа сәйкес қауіпсіз, жеткілікті, біркелкі және көзге жайлы жарық ортасын қалыптастыру.","image":null},{"text":"жұмыскерге еңбек қызметі барысында зиянды өндірістік факторлардың әсер етуінен туындаған ауру.","image":null},{"text":"тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null},{"text":"жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null}],"image":null},{"id":140,"question":"«Өздігінен жану» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","variants":[{"text":"сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"жұмыс берушінің негізгі міндеттерінің бірі.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null}],"image":null},{"id":141,"question":"«Оқиға орнын зерттеу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"тергеудің маңызды кезеңдерінің бірі.","variants":[{"text":"тергеудің маңызды кезеңдерінің бірі.","image":null},{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"адамның белгілі бір қалыпта ұзақ уақыт тұруы немесе бұлшық еттердің ұзақ уақыт бойы күш түсірілген жағдайда болуы.","image":null},{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null}],"image":null},{"id":142,"question":"«Тербелмелі шу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","variants":[{"text":"дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null}],"image":null},{"id":143,"question":"«Аралас табиғи жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","variants":[{"text":"шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null},{"text":"қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","image":null},{"text":"жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null}],"image":null},{"id":144,"question":"«Жарылыс» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","variants":[{"text":"энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтауға бағытталған кешенді жүйе. Қауіпсіз еңбек жағдайын қалыптастыру үшін жұмыс беруші қажетті техникалық және ұйымдық шараларды орындауы, ал жұмыскер белгіленген қауіпсіздік талаптарын сақтауы қажет.","image":null},{"text":"өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"еңбек заңнамасының орындалуын тексеру және анықталған заң бұзушылықтарды жоюға бағытталған шаралар қабылдау.","image":null},{"text":"дыбыс деңгейін сипаттайтын салыстырмалы өлшем бірлігі. Шу деңгейін анықтау үшін арнайы шумомер (шу өлшегіш) қолданылады.","image":null}],"image":null},{"id":145,"question":"«Статикалық электр» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","variants":[{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтауға бағытталған кешенді жүйе. Қауіпсіз еңбек жағдайын қалыптастыру үшін жұмыс беруші қажетті техникалық және ұйымдық шараларды орындауы, ал жұмыскер белгіленген қауіпсіздік талаптарын сақтауы қажет.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null},{"text":"жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null}],"image":null},{"id":146,"question":"«Еңбекті қорғау жөніндегі техникалық инспектор» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","variants":[{"text":"ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"адамды қауіпті немесе экстремалды қоршаған ортадан барынша оқшаулау.","image":null},{"text":"уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null}],"image":null},{"id":147,"question":"«Механикалық желдету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","variants":[{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null},{"text":"оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null},{"text":"өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null}],"image":null},{"id":148,"question":"«Қауіпсіздік мәдениеті» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","variants":[{"text":"кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null},{"text":"өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null}],"image":null},{"id":149,"question":"«Зиянды өндірістік фактор» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","variants":[{"text":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"жанғыш заттың температурасын төмендету.","image":null},{"text":"жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null}],"image":null},{"id":150,"question":"«Сенсибилизациялаушы заттар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","variants":[{"text":"ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","image":null},{"text":"жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null},{"text":"ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","image":null},{"text":"жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null},{"text":"жарықтандырылу (E). Оның өлшем бірлігі – люкс (лк).","image":null}],"image":null},{"id":151,"question":"«Салыстырмалы ылғалдылық» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ауадағы су буының мөлшерін сипаттайтын көрсеткіш.","variants":[{"text":"ауадағы су буының мөлшерін сипаттайтын көрсеткіш.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null}],"image":null},{"id":152,"question":"«Өрттің алдын алу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"өрт қауіпсіздігінің ең маңызды бағыты.","variants":[{"text":"өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null}],"image":null},{"id":153,"question":"«Жазатайым оқиғаны тергеудің негізгі нәтижесі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қауіптің қайталануын болдырмау.","variants":[{"text":"қауіптің қайталануын болдырмау.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null},{"text":"электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null}],"image":null},{"id":154,"question":"«Үзілмелі шу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","variants":[{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"қалыпты жағдайда кернеу болмайтын, бірақ оқшаулама бұзылған жағдайда кернеу астында қалуы мүмкін өткізгіш бөліктерді жерге қосу арқылы электр қауіпсіздігін арттыру тәсілі.","image":null},{"text":"тұтандыру көзінің әсерінен жанудың басталуы.","image":null},{"text":"сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null},{"text":"дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","image":null}],"image":null},{"id":155,"question":"«Аралас жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","variants":[{"text":"жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null}],"image":null},{"id":156,"question":"«Г категориясы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","variants":[{"text":"жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"жұмыс беруші мен жұмыскерлердің белгіленген еңбек ережелері мен міндеттерін тиісінше орындауы.","image":null}],"image":null},{"id":157,"question":"«Қадам кернеуі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","variants":[{"text":"адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","image":null},{"text":"еңбек қызметі кезінде жұмыскердің денсаулығына зиян келу ықтималдығы.","image":null},{"text":"зиянды өндірістік факторлардың жұмыскерлерге әсерін болдырмауға немесе олардың әсер ету деңгейін төмендетуге бағытталған санитариялық-гигиеналық, ұйымдастырушылық іс-шаралар мен техникалық құралдар жүйесі.","image":null},{"text":"тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null},{"text":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null}],"image":null},{"id":158,"question":"«Өндірістік кеңес» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","variants":[{"text":"жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"қалыпты өндірістік процесті қамтамасыз етеді.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","image":null},{"text":"оқиғаның барлық себептерін жан-жақты зерттеу және еңбек қауіпсіздігі талаптарының бұзылуына жол берген себептерді анықтау.","image":null}],"image":null},{"id":159,"question":"«Шекті рұқсат етілген концентрация (ШРЕК)» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","variants":[{"text":"жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","image":null},{"text":"ауадағы су буының мөлшерін сипаттайтын көрсеткіш.","image":null},{"text":"қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null}],"image":null},{"id":160,"question":"«Өндірістік жарақаттануды төмендетудің негізгі жолы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жазатайым оқиғалардың алдын алу.","variants":[{"text":"жазатайым оқиғалардың алдын алу.","image":null},{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"электр тогының газ ортасы арқылы өтуінен пайда болатын жоғары энергиялы разряд.","image":null},{"text":"жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"жұмыскерлерді еңбек қауіпсіздігі бойынша оқыту.","image":null}],"image":null},{"id":161,"question":"«Жеке қорғаныш құралдары» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","variants":[{"text":"жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","image":null},{"text":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null},{"text":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null},{"text":"жанғыш заттың температурасын төмендету.","image":null}],"image":null},{"id":162,"question":"«Мутагендік заттар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ағзадағы генетикалық материалға кері әсер етуі мүмкін.","variants":[{"text":"ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null}],"image":null},{"id":163,"question":"«Желдету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"өндірістік бөлмелерден ластанған, ыстық немесе шамадан тыс ылғалды ауаны шығарып, оның орнына таза ауа беруге арналған шаралар мен техникалық құрылғылар жүйесі.","variants":[{"text":"өндірістік бөлмелерден ластанған, ыстық немесе шамадан тыс ылғалды ауаны шығарып, оның орнына таза ауа беруге арналған шаралар мен техникалық құрылғылар жүйесі.","image":null},{"text":"автомобиль, теміржол және әуе көлігі.","image":null},{"text":"қауіпті жанасу кернеуін азайту және қорғаныс аппаратының іске қосылуына жағдай жасау.","image":null},{"text":"кәсіпорындағы еңбек қауіпсіздігі мен еңбекті қорғауды жоспарлау, ұйымдастыру, бақылау және жетілдіру бойынша өзара байланысты шаралар жиынтығы.","image":null},{"text":"жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null}],"image":null},{"id":164,"question":"«Салқындату» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш заттың температурасын төмендету.","variants":[{"text":"жанғыш заттың температурасын төмендету.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null},{"text":"қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null},{"text":"ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null}],"image":null},{"id":165,"question":"«Жазатайым оқиғаларды болдырмаудың ең тиімді жолы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"олардың себептерін алдын ала анықтау.","variants":[{"text":"олардың себептерін алдын ала анықтау.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null},{"text":"жұмыскерге еңбек қызметі барысында зиянды өндірістік факторлардың әсер етуінен туындаған ауру.","image":null}],"image":null},{"id":166,"question":"«Импульстік шу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","variants":[{"text":"қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null},{"text":"жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"терезелер, фрамугалар және арнайы желдету саңылаулары арқылы ауа алмасу.","image":null},{"text":"жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null}],"image":null},{"id":167,"question":"«Жұмыстық жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"қалыпты өндірістік процесті қамтамасыз етеді.","variants":[{"text":"қалыпты өндірістік процесті қамтамасыз етеді.","image":null},{"text":"еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null}],"image":null},{"id":168,"question":"«Д категориясы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","variants":[{"text":"жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","image":null},{"text":"еңбек қауіпсіздігін қамтамасыз етудің алғашқы кезеңдерінің бірі. Фактор анықталғаннан кейін оның жұмыскерге әсер ету ықтималдығы мен салдарының ауырлығы бағаланып, тиісті қорғану шаралары белгіленеді.","image":null},{"text":"еңбек заңнамасының сақталуына мемлекеттік бақылауды жүзеге асыратын лауазымды тұлға.","image":null},{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null}],"image":null},{"id":169,"question":"«Жанасу кернеуі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"адам бір уақытта жанасатын өткізгіш бөліктер арасындағы потенциалдар айырмасы.","variants":[{"text":"адам бір уақытта жанасатын өткізгіш бөліктер арасындағы потенциалдар айырмасы.","image":null},{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","image":null}],"image":null},{"id":170,"question":"«Әлеуметтік әріптестік» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","variants":[{"text":"жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"жанғыш заттың температурасын төмендету.","image":null},{"text":"сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":171,"question":"«Өндірістік желдету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","variants":[{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","image":null},{"text":"өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"қауіпті жағдайларды жазатайым оқиға болғанға дейін анықтау және жою.","image":null},{"text":"жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null}],"image":null},{"id":172,"question":"«Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","variants":[{"text":"еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім. Ол жұмыскердің атқаратын қызметін, еңбек жағдайларын, еңбекақысын және тараптардың міндеттерін белгілейді.","image":null},{"text":"заттардың тотықтырғышпен әрекеттесуі нәтижесінде жылу және көбінесе жарық бөлінуімен жүретін күрделі физика-химиялық процесс.","image":null},{"text":"жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null}],"image":null},{"id":173,"question":"«Өндірістегі жазатайым оқиға» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","variants":[{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"адамның ағзасын өндірістік ортаның қауіпті және зиянды факторларының әсерінен қорғауға арналған арнайы құралдар мен бұйымдар. Олар жұмысшының денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға мүмкіндік береді.","image":null},{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null}],"image":null},{"id":174,"question":"«Репродуктивтік жүйеге әсер ететін заттар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","variants":[{"text":"адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","image":null},{"text":"олардың себептерін алдын ала анықтау.","image":null},{"text":"жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","image":null},{"text":"шу пайда болған жерден бастап оның деңгейін төмендету.","image":null}],"image":null},{"id":175,"question":"«Жеке гигиена» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","variants":[{"text":"жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null},{"text":"адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","image":null},{"text":"адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null}],"image":null},{"id":176,"question":"«Оқшаулау» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш затты ауадағы оттегіден бөлу.","variants":[{"text":"жанғыш затты ауадағы оттегіден бөлу.","image":null},{"text":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"жұмыс беруші мен жұмыскерлердің белгіленген еңбек ережелері мен міндеттерін тиісінше орындауы.","image":null},{"text":"материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null}],"image":null},{"id":177,"question":"«Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","variants":[{"text":"еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","image":null},{"text":"өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null}],"image":null},{"id":178,"question":"«Импульстік шудың ерекшелігі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","variants":[{"text":"дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","image":null},{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"заттардың тотықтырғышпен әрекеттесуі нәтижесінде жылу және көбінесе жарық бөлінуімен жүретін күрделі физика-химиялық процесс.","image":null},{"text":"машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null}],"image":null},{"id":179,"question":"«Апаттық жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","variants":[{"text":"негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"адам бір уақытта жанасатын өткізгіш бөліктер арасындағы потенциалдар айырмасы.","image":null},{"text":"тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null}],"image":null},{"id":180,"question":"«Кемшілігі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","variants":[{"text":"пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"ағзаның улануына және мүшелер қызметінің бұзылуына әкелуі мүмкін.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null}],"image":null},{"id":181,"question":"«Электр тогымен зақымданған адамға көмек көрсетудегі бірінші міндет» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"оны ток әсерінен қауіпсіз босату.","variants":[{"text":"оны ток әсерінен қауіпсіз босату.","image":null},{"text":"оқиғаның себебін анықтап, осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"жарық сыртқы қабырғалардағы терезелер мен басқа жарық саңылаулары арқылы түседі.","image":null},{"text":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"жанғыш затты ауадағы оттегіден бөлу.","image":null}],"image":null},{"id":182,"question":"«Мемлекеттік және ішкі бақылаудың ортақ мақсаты» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің өмірі мен денсаулығын сақтау.","variants":[{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"еңбек заңнамасының сақталуына мемлекеттік бақылауды жүзеге асыратын лауазымды тұлға.","image":null}],"image":null},{"id":183,"question":"«Желдетудің негізгі міндеті» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","variants":[{"text":"жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","image":null},{"text":"жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім. Ол жұмыскердің атқаратын қызметін, еңбек жағдайларын, еңбекақысын және тараптардың міндеттерін белгілейді.","image":null},{"text":"энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null}],"image":null},{"id":184,"question":"«Өндірістік жарақат» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","variants":[{"text":"жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"шу пайда болған жерден бастап оның деңгейін төмендету.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null}],"image":null},{"id":185,"question":"«Кәсіптік ауру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","variants":[{"text":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"қызметкердің еңбек міндеттерін орындау барысында немесе жұмыс берушінің тапсырмасын орындау кезінде денсаулығына зиян келуіне, жарақат алуына, еңбекке қабілеттілігін жоғалтуына немесе қайтыс болуына алып келген оқиға.","image":null},{"text":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"олардың себептерін алдын ала анықтау.","image":null}],"image":null},{"id":186,"question":"«Биологиялық факторлар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","variants":[{"text":"адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"жұмыскердің еңбек қызметін жүзеге асырған уақыт
