 кезеңі.","image":null},{"text":"өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":187,"question":"«Өндірістік санитария мен еңбек гигиенасының негізгі міндеті» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","variants":[{"text":"жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null},{"text":"қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null},{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null},{"text":"жазалау ғана емес, еңбек заңнамасының бұзылуының және жазатайым оқиғалардың алдын алу.","image":null},{"text":"бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","image":null}],"image":null},{"id":188,"question":"«Жанғыш ортаны азайту» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","variants":[{"text":"жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"жанғыш заттың температурасын төмендету.","image":null},{"text":"еңбек заңнамасы мен еңбек қауіпсіздігі талаптарының орындалуын қамтамасыз ету.","image":null},{"text":"ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","image":null},{"text":"өрт немесе басқа төтенше жағдай кезінде адамдардың қауіпті аймақтан қауіпсіз жерге ұйымдасқан түрде шығуы.","image":null}],"image":null},{"id":189,"question":"«Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","variants":[{"text":"жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null}],"image":null},{"id":190,"question":"«Діріл» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","variants":[{"text":"машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","image":null},{"text":"шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null}],"image":null},{"id":191,"question":"«Эвакуациялық жарықтандыру» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","variants":[{"text":"апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","image":null},{"text":"еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"адамды қауіпті немесе экстремалды қоршаған ортадан барынша оқшаулау.","image":null},{"text":"жұмыскерлерді еңбек қауіпсіздігі бойынша оқыту.","image":null}],"image":null},{"id":192,"question":"«Оның маңызды ерекшелігі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","variants":[{"text":"барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","image":null},{"text":"жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"жұмыскерлердің еңбек құқықтарын қорғау және жұмыс орындарында еңбек заңнамасының сақталуын қамтамасыз ету.","image":null},{"text":"жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null}],"image":null},{"id":193,"question":"«Қазақстанда жедел жәрдем нөмірі» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"103, бірыңғай шұғыл қызмет – 112.","variants":[{"text":"103, бірыңғай шұғыл қызмет – 112.","image":null},{"text":"жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null},{"text":"әсер ету нәтижесінде жұмыскердің ауруына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"адамның еңбек әрекеті мен жұмыс ортасының өзара үйлесімділігін зерттейтін сала. ЖҚҚ-ның эргономикалық қасиеттері оның жұмысшыға қаншалықты ыңғайлы, қауіпсіз және тиімді екенін сипаттайды.","image":null},{"text":"ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null}],"image":null},{"id":194,"question":"«Еңбек инспекциясының негізгі бағыттары» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","variants":[{"text":"мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","image":null},{"text":"тек болған оқиғаны тіркеу емес, оның қайталануына жол бермеу.","image":null},{"text":"еңбек заңнамасы мен еңбек қауіпсіздігі талаптарының орындалуын қамтамасыз ету.","image":null},{"text":"еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null},{"text":"жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null}],"image":null},{"id":195,"question":"«Өндірістік желдету» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","variants":[{"text":"жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null},{"text":"қалыпты өндірістік процесті қамтамасыз етеді.","image":null},{"text":"жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null},{"text":"жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null},{"text":"сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":196,"question":"«Өндірістік жарақаттанушылық» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","variants":[{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"қозғалыс кезінде, ауыр заттарды көтеру, тасымалдау немесе басқа дене жұмыстарын орындау кезінде пайда болатын жүктеме.","image":null},{"text":"еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null}],"image":null},{"id":197,"question":"«Ауыр жұмыстар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","variants":[{"text":"ауыр заттарды қолмен көтеру, жылжыту немесе едәуір дене күшін жұмсауды қажет ететін жұмыстар.","image":null},{"text":"ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","image":null},{"text":"белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null}],"image":null},{"id":198,"question":"«Психофизиологиялық факторлар» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","variants":[{"text":"жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"дыбыс деңгейін сипаттайтын салыстырмалы өлшем бірлігі. Шу деңгейін анықтау үшін арнайы шумомер (шу өлшегіш) қолданылады.","image":null},{"text":"жұмыскерге ұзақ немесе жүйелі түрде әсер ету нәтижесінде оның денсаулығының нашарлауына, кәсіптік аурудың пайда болуына немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"жұмыскердің денсаулығына, еңбекке қабілеттілігіне кері әсер етуі мүмкін өндірістік жағдайлар.","image":null}],"image":null},{"id":199,"question":"«Еңбек гигиенасы» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","variants":[{"text":"жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","image":null}],"image":null},{"id":200,"question":"«Химиялық тежеу» ұғымының дәрістегі дұрыс сипаттамасын таңдаңыз.","correct":"арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","variants":[{"text":"арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","image":null},{"text":"жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"тергеудің маңызды кезеңдерінің бірі.","image":null},{"text":"еңбек заңнамасының сақталуына мемлекеттік бақылауды жүзеге асыратын лауазымды тұлға.","image":null},{"text":"еңбек қызметі барысында жұмыскердің өмірі мен денсаулығын, қауіпсіздігін және еңбекке қабілеттілігін сақтауға бағытталған құқықтық, әлеуметтік-экономикалық, ұйымдық-техникалық, санитариялық-гигиеналық және емдік-профилактикалық шаралар жүйесі.","image":null}],"image":null},{"id":201,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Қауіпті өндірістік фактор» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Қауіпті өндірістік фактор: белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","variants":[{"text":"Қауіпті өндірістік фактор: белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","image":null},{"text":"Еңбек шарты: жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім. Ол жұмыскердің атқаратын қызметін, еңбек жағдайларын, еңбекақысын және тараптардың міндеттерін белгілейді.","image":null},{"text":"Кемшілігі: пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"Негізгі мақсат: қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"Электр қауіпсіздігі: электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","image":null}],"image":null},{"id":202,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Тітіркендіргіш заттар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","variants":[{"text":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"Табиғи желдету: бөлме ішіндегі және сыртындағы температура мен ауа қысымының айырмашылығы, сондай-ақ желдің әсерінен жүзеге асатын ауа алмасу.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"Кәсіптік ауру: жұмыскерге еңбек қызметі барысында зиянды өндірістік факторлардың әсер етуінен туындаған ауру.","image":null},{"text":"Импульстік шу: қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null}],"image":null},{"id":203,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Ауа температурасы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","variants":[{"text":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null},{"text":"Мемлекеттік еңбек инспекциясы: Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null},{"text":"Кезекші жарықтандыру: жұмыс жүргізілмейтін уақытта ғимаратта қажетті ең төменгі жарық деңгейін қамтамасыз етеді.","image":null},{"text":"Салауатты және қауіпсіз еңбек жағдайлары: жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null},{"text":"Еңбекті қорғаудың басты мақсаты: өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":204,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өздігінен жану» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","variants":[{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"Әлеуметтік әріптестік: жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"Жану: заттардың тотықтырғышпен әрекеттесуі нәтижесінде жылу және көбінесе жарық бөлінуімен жүретін күрделі физика-химиялық процесс.","image":null},{"text":"Электр қауіпсіздігі: электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null}],"image":null},{"id":205,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Оқиға орнын зерттеу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Оқиға орнын зерттеу: тергеудің маңызды кезеңдерінің бірі.","variants":[{"text":"Оқиға орнын зерттеу: тергеудің маңызды кезеңдерінің бірі.","image":null},{"text":"Өндірістік жарақат: жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"Жеке қорғаныш құралдары: жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","image":null},{"text":"Физикалық факторлар: жұмыскерге өндірістік жабдықтардың, машиналардың, қоршаған ортаның физикалық параметрлерінің, электр энергиясының, сәулеленудің және басқа физикалық құбылыстардың әсер етуімен байланысты факторлар.","image":null},{"text":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null}],"image":null},{"id":206,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Тербелмелі шу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Тербелмелі шу: дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","variants":[{"text":"Тербелмелі шу: дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"Жеке қорғану құралдары: өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Өндірістік жарақат: жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"Жеке гигиена: жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null}],"image":null},{"id":207,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Аралас табиғи жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Аралас табиғи жарықтандыру: шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","variants":[{"text":"Аралас табиғи жарықтандыру: шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Шекті рұқсат етілген концентрация (ШРЕК): жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null}],"image":null},{"id":208,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жарылыс» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","variants":[{"text":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"Химиялық факторлар: өндірісте қолданылатын немесе технологиялық процесс барысында пайда болатын химиялық заттардың адам ағзасына зиянды әсер етуімен байланысты факторлар.","image":null},{"text":"Жеке қорғану құралдары: өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":209,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Статикалық электр» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Статикалық электр: материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","variants":[{"text":"Статикалық электр: материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"Жану: жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"Олардың артықшылығы: қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null},{"text":"Мутагендік заттар: ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"Табиғи жарықтандырудың негізгі көзі: Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","image":null}],"image":null},{"id":210,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбекті қорғау жөніндегі техникалық инспектор» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","variants":[{"text":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"Еңбек қауіпсіздігі мен еңбекті қорғаудың басты қағидаты: жұмыскердің өмірі мен денсаулығының өндірістік қызмет нәтижелерінен басымдығы.","image":null},{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Өндірістік кеңес: жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null}],"image":null},{"id":211,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Механикалық желдету» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Механикалық желдету: ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","variants":[{"text":"Механикалық желдету: ауаны желдеткіштер және басқа техникалық құрылғылар арқылы қозғалысқа келтіретін жүйе.","image":null},{"text":"Жұмыс орны: жұмыскердің еңбек міндеттерін тұрақты немесе уақытша орындайтын орны.","image":null},{"text":"Жұмыс уақыты: жұмыскер еңбек міндеттерін орындайтын уақыт.","image":null},{"text":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null},{"text":"Қадам кернеуі: адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","image":null}],"image":null},{"id":212,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Қауіпсіздік мәдениеті» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","variants":[{"text":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null},{"text":"Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу: еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"Еңбекті қорғауды басқару жүйесі (ЕҚБЖ): кәсіпорындағы еңбек қауіпсіздігі мен еңбекті қорғауды жоспарлау, ұйымдастыру, бақылау және жетілдіру бойынша өзара байланысты шаралар жиынтығы.","image":null},{"text":"Жұмыс орнын рационалды жарықтандыру: қауіпсіз және өнімді еңбек жағдайларын қалыптастыратын негізгі өндірістік факторлардың бірі.","image":null},{"text":"Өздігінен тұтану: сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":213,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Зиянды өндірістік фактор» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","variants":[{"text":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","image":null},{"text":"Шекті рұқсат етілген концентрация (ШРЕК): жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","image":null},{"text":"Гетерогенді жану: жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null},{"text":"Мемлекеттік және ішкі бақылаудың ортақ мақсаты: жұмыскердің өмірі мен денсаулығын сақтау.","image":null}],"image":null},{"id":214,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Сенсибилизациялаушы заттар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Сенсибилизациялаушы заттар: ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","variants":[{"text":"Сенсибилизациялаушы заттар: ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","image":null},{"text":"Жеке қорғану құралдары: адамның ағзасын өндірістік ортаның қауіпті және зиянды факторларының әсерінен қорғауға арналған арнайы құралдар мен бұйымдар. Олар жұмысшының денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға мүмкіндік береді.","image":null},{"text":"Өрт қауіпсіздігі: еңбекті қорғаудың маңызды бағыттарының бірі. Оның басты мақсаты – өрттің алдын алу, ал өрт туындаған жағдайда адамдардың өмірі мен денсаулығын қорғау және материалдық шығынды барынша азайту.","image":null},{"text":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","image":null}],"image":null},{"id":215,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Салыстырмалы ылғалдылық» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес? Салыстырмалы ылғалдылық: ауадағы су буының мөлшерін сипаттайтын көрсеткіш.","correct":"","variants":[{"text":"","image":null},{"text":"Күзеттік жарықтандыру: өндірістік аумақтарды түнгі уақытта күзету үшін пайдаланылады.","image":null},{"text":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"Өндірістік санитария: зиянды өндірістік факторлардың жұмыскерлерге әсерін болдырмауға немесе олардың әсер ету деңгейін төмендетуге бағытталған санитариялық-гигиеналық, ұйымдастырушылық іс-шаралар мен техникалық құралдар жүйесі.","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null}],"image":null},{"id":216,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өрттің алдын алу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өрттің алдын алу: өрт қауіпсіздігінің ең маңызды бағыты.","variants":[{"text":"Өрттің алдын алу: өрт қауіпсіздігінің ең маңызды бағыты.","image":null},{"text":"Желдетудің негізгі міндеті: жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","image":null},{"text":"Сондықтан жарықтандырудың мақсаты: жұмыс орнын мүмкіндігінше қатты жарықтандыру емес, орындалатын жұмысқа сәйкес қауіпсіз, жеткілікті, біркелкі және көзге жайлы жарық ортасын қалыптастыру.","image":null},{"text":"Негізгі мақсат: қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null}],"image":null},{"id":217,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жазатайым оқиғаны тергеудің негізгі нәтижесі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жазатайым оқиғаны тергеудің негізгі нәтижесі: қауіптің қайталануын болдырмау.","variants":[{"text":"Жазатайым оқиғаны тергеудің негізгі нәтижесі: қауіптің қайталануын болдырмау.","image":null},{"text":"Салқындату: жанғыш заттың температурасын төмендету.","image":null},{"text":"Жеке қорғану құралдары: өндірістік қауіпсіздіктің маңызды элементтерінің бірі. Олар жұмысшыларды механикалық, химиялық, физикалық және биологиялық факторлардың зиянды әсерінен қорғауға мүмкіндік береді.","image":null},{"text":"Жұмыс орнында қауіпсіз жағдай жасау: жұмыс берушінің негізгі міндеттерінің бірі.","image":null},{"text":"Жеке гигиена: жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null}],"image":null},{"id":218,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Үзілмелі шу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","variants":[{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","image":null},{"text":"Салауатты және қауіпсіз еңбек жағдайлары: жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null},{"text":"Табиғи жарықтандырудың негізгі көзі: Күннің сәулелік энергиясы. Күн сәулесі жер бетіне тікелей және атмосферада шашыраған жарық түрінде түседі.","image":null},{"text":"Жазатайым оқиғаларды болдырмаудың ең тиімді жолы: олардың себептерін алдын ала анықтау.","image":null}],"image":null},{"id":219,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Аралас жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Аралас жарықтандыру: жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","variants":[{"text":"Аралас жарықтандыру: жалпы және жергілікті жарықтандырудың бір уақытта қолданылуы.","image":null},{"text":"Нөлдеу: электр жабдығының ашық өткізгіш бөліктерін электр желісінің тиісті қорғаныш өткізгішімен байланыстыру арқылы қорғанысты қамтамасыз ету тәсілі.","image":null},{"text":"Аралас табиғи жарықтандыру: шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"Сондықтан жарықтандырудың мақсаты: жұмыс орнын мүмкіндігінше қатты жарықтандыру емес, орындалатын жұмысқа сәйкес қауіпсіз, жеткілікті, біркелкі және көзге жайлы жарық ортасын қалыптастыру.","image":null},{"text":"Салауатты және қауіпсіз еңбек жағдайлары: жұмыскердің өмірі мен денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға бағытталған ұйымдастырушылық, техникалық, санитариялық-гигиеналық және профилактикалық шаралар жүйесі.","image":null}],"image":null},{"id":220,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Г категориясы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Г категориясы: жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","variants":[{"text":"Г категориясы: жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null},{"text":"Сондықтан жарықтандырудың мақсаты: жұмыс орнын мүмкіндігінше қатты жарықтандыру емес, орындалатын жұмысқа сәйкес қауіпсіз, жеткілікті, біркелкі және көзге жайлы жарық ортасын қалыптастыру.","image":null},{"text":"Жазатайым оқиға орын алған кезде ең бірінші міндет: зардап шеккен адамның өмірі мен денсаулығын сақтау.","image":null},{"text":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null},{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null}],"image":null},{"id":221,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Қадам кернеуі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Қадам кернеуі: адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","variants":[{"text":"Қадам кернеуі: адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","image":null},{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"Жарақаттанудың алдын алудың басты мақсаты: қауіпті жағдайдың пайда болу ықтималдығын мүмкіндігінше төмендету.","image":null},{"text":"Эргономика: адамның еңбек әрекеті мен жұмыс ортасының өзара үйлесімділігін зерттейтін сала. ЖҚҚ-ның эргономикалық қасиеттері оның жұмысшыға қаншалықты ыңғайлы, қауіпсіз және тиімді екенін сипаттайды.","image":null}],"image":null},{"id":222,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік кеңес» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік кеңес: жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","variants":[{"text":"Өндірістік кеңес: жұмыс беруші мен жұмыскерлер өкілдерінің еңбек қауіпсіздігі мәселелерін бірлесіп қарауына арналған құрылым.","image":null},{"text":"Өндірістік желдету: жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null},{"text":"Қауіпсіздік мәдениеті: ұйымдағы барлық қызметкерлердің қауіпсіздікті күнделікті жұмыстың маңызды құндылығы ретінде қабылдауы.","image":null},{"text":"Жұмыс орнын рационалды жарықтандыру: қауіпсіз және өнімді еңбек жағдайларын қалыптастыратын негізгі өндірістік факторлардың бірі.","image":null},{"text":"Шудан қорғауда ең тиімді тәсіл: шу пайда болған жерден бастап оның деңгейін төмендету.","image":null}],"image":null},{"id":223,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Шекті рұқсат етілген концентрация (ШРЕК)» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Шекті рұқсат етілген концентрация (ШРЕК): жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","variants":[{"text":"Шекті рұқсат етілген концентрация (ШРЕК): жұмыс аймағы ауасындағы зиянды заттың белгіленген еңбек жағдайында жұмыскер денсаулығына зиянды әсер етпеуі тиіс нормативтік концентрациясы.","image":null},{"text":"Химиялық тежеу: арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","image":null},{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға, өндірістік орта мен еңбек процесінің қолайсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар мен құралдар кешені.","image":null},{"text":"Тербелмелі шу: дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"Ішкі бақылаудың мақсаты: қауіпті жағдайларды жазатайым оқиға болғанға дейін анықтау және жою.","image":null}],"image":null},{"id":224,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік жарақаттануды төмендетудің негізгі жолы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік жарақаттануды төмендетудің негізгі жолы: жазатайым оқиғалардың алдын алу.","variants":[{"text":"Өндірістік жарақаттануды төмендетудің негізгі жолы: жазатайым оқиғалардың алдын алу.","image":null},{"text":"Қадам кернеуі: адамның екі аяғы орналасқан жер нүктелерінің арасындағы потенциалдар айырмасы.","image":null},{"text":"Еңбек гигиенасы: жұмыскерлердің денсаулығын сақтауға және өндірістік ортаның жағымсыз әсерлерінің алдын алуға бағытталған санитариялық-гигиеналық шаралар жүйесі.","image":null},{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"Өндірістік зияндылықтар: өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null}],"image":null},{"id":225,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жеке қорғаныш құралдары» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жеке қорғаныш құралдары: жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","variants":[{"text":"Жеке қорғаныш құралдары: жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","image":null},{"text":"Жану: жылу және көбінесе жарық бөле жүретін химиялық тотығу процесі.","image":null},{"text":"Салқындату: жанғыш заттың температурасын төмендету.","image":null},{"text":"Еңбекті қорғау: жұмыскердің өмірі мен денсаулығын сақтауға бағытталған кешенді жүйе. Қауіпсіз еңбек жағдайын қалыптастыру үшін жұмыс беруші қажетті техникалық және ұйымдық шараларды орындауы, ал жұмыскер белгіленген қауіпсіздік талаптарын сақтауы қажет.","image":null},{"text":"Сенсибилизациялаушы заттар: ағзаның сезімталдығын арттырып, аллергиялық реакциялар туғызуы мүмкін.","image":null}],"image":null},{"id":226,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Мутагендік заттар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Мутагендік заттар: ағзадағы генетикалық материалға кері әсер етуі мүмкін.","variants":[{"text":"Мутагендік заттар: ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"Әлеуметтік әріптестік: жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"Тұрақты шу: жұмыс уақытында дыбыс деңгейі салыстырмалы түрде аз өзгеретін шу.","image":null},{"text":"Еңбек өтілі: жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null}],"image":null},{"id":227,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Желдету» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Желдету: өндірістік бөлмелерден ластанған, ыстық немесе шамадан тыс ылғалды ауаны шығарып, оның орнына таза ауа беруге арналған шаралар мен техникалық құрылғылар жүйесі.","variants":[{"text":"Желдету: өндірістік бөлмелерден ластанған, ыстық немесе шамадан тыс ылғалды ауаны шығарып, оның орнына таза ауа беруге арналған шаралар мен техникалық құрылғылар жүйесі.","image":null},{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null},{"text":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"Биологиялық факторлар: адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null}],"image":null},{"id":228,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Салқындату» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Салқындату: жанғыш заттың температурасын төмендету.","variants":[{"text":"Салқындату: жанғыш заттың температурасын төмендету.","image":null},{"text":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","image":null},{"text":"Оқшаулағыш костюмдердің негізгі мақсаты: адамды қауіпті немесе экстремалды қоршаған ортадан барынша оқшаулау.","image":null},{"text":"Қауіпті өндірістік фактор: белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","image":null},{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":229,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жазатайым оқиғаларды болдырмаудың ең тиімді жолы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жазатайым оқиғаларды болдырмаудың ең тиімді жолы: олардың себептерін алдын ала анықтау.","variants":[{"text":"Жазатайым оқиғаларды болдырмаудың ең тиімді жолы: олардың себептерін алдын ала анықтау.","image":null},{"text":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","image":null},{"text":"Өздігінен тұтану: сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null},{"text":"Жұмыс аймағы: жұмыскерлер тұрақты немесе уақытша болатын өндірістік кеңістіктің бөлігі.","image":null},{"text":"Зиянды еңбек жағдайлары: жұмыскердің денсаулығына, еңбекке қабілеттілігіне кері әсер етуі мүмкін өндірістік жағдайлар.","image":null}],"image":null},{"id":230,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Импульстік шу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Импульстік шу: қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","variants":[{"text":"Импульстік шу: қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null},{"text":"Оқшаулағыш костюмдердің негізгі мақсаты: адамды қауіпті немесе экстремалды қоршаған ортадан барынша оқшаулау.","image":null},{"text":"Тұрақсыз шу: уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"Жеке қорғаныш құралдары: жұмыскерді зиянды және қауіпті өндірістік факторлардан қорғауға арналған арнайы құралдар.","image":null},{"text":"Жарқ ету: жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null}],"image":null},{"id":231,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жұмыстық жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жұмыстық жарықтандыру: қалыпты өндірістік процесті қамтамасыз етеді.","variants":[{"text":"Жұмыстық жарықтандыру: қалыпты өндірістік процесті қамтамасыз етеді.","image":null},{"text":"Негізгі қағида: шу мен дірілдің зиянды әсерін азайтудың ең тиімді жолы: олардың пайда болу көзін бақылау, әсер ету деңгейін төмендету және жұмысшыны қажетті қорғаныс құралдарымен қамтамасыз ету.","image":null},{"text":"Аралас табиғи жарықтандыру: шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"Өрт хабарлау жүйесі: өрт белгілерін анықтауға, өрт туралы дабыл беруге және адамдарға қауіп туралы хабарлауға арналған техникалық құралдар жиынтығы.","image":null},{"text":"Гетерогенді жану: жанғыш зат пен тотықтырғыш әртүрлі агрегаттық күйде болған кезде жүретін жану. Мысалы, қатты заттың ауада жануы.","image":null}],"image":null},{"id":232,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Д категориясы» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Д категориясы: жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","variants":[{"text":"Д категориясы: жанбайтын заттар мен материалдар суық күйінде болатын үй-жайлар","image":null},{"text":"Тұрақсыз шу: уақыт бойынша дыбыс деңгейі айтарлықтай өзгеретін шу.","image":null},{"text":"Психофизиологиялық факторлар: жұмыскердің физикалық және жүйке-психикалық жағдайына шамадан тыс күш түсірумен байланысты өндірістік факторлар.","image":null},{"text":"Статикалық электр: материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"Г категориясы: жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null}],"image":null},{"id":233,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жанасу кернеуі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жанасу кернеуі: адам бір уақытта жанасатын өткізгіш бөліктер арасындағы потенциалдар айырмасы.","variants":[{"text":"Жанасу кернеуі: адам бір уақытта жанасатын өткізгіш бөліктер арасындағы потенциалдар айырмасы.","image":null},{"text":"Өндірістегі жазатайым оқиға: жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"Өздігінен тұтану: сыртқы ашық тұтандыру көзінсіз заттың ішіндегі физикалық, химиялық немесе биологиялық процестердің нәтижесінде температура жоғарылап, жанудың басталуы.","image":null}],"image":null},{"id":234,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Әлеуметтік әріптестік» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Әлеуметтік әріптестік: жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","variants":[{"text":"Әлеуметтік әріптестік: жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null},{"text":"Еңбек дауы: жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null},{"text":"Еңбек өтілі: жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Еңбек тәртібі: жұмыс беруші мен жұмыскерлердің белгіленген еңбек ережелері мен міндеттерін тиісінше орындауы.","image":null}],"image":null},{"id":235,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік желдету» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","variants":[{"text":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"Мемлекеттік және ішкі бақылаудың ортақ мақсаты: жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"Жану: заттардың тотықтырғышпен әрекеттесуі нәтижесінде жылу және көбінесе жарық бөлінуімен жүретін күрделі физика-химиялық процесс.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":236,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау: еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","variants":[{"text":"Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау: еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null},{"text":"Жоғарғы жарықтандыру: жарық ғимарат төбесіндегі фонарьлар, арнайы жарық саңылаулары арқылы түседі.","image":null},{"text":"Өндірістік ортадағы еңбек жағдайын қалыптастыратын маңызды факторлардың бірі: жұмыс орнын дұрыс жарықтандыру. Жарықтандыру адамның көру қабілетіне, еңбек өнімділігіне, жұмыс сапасына және өндірістік қауіпсіздікке тікелей әсер етеді.","image":null}],"image":null},{"id":237,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістегі жазатайым оқиға» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістегі жазатайым оқиға: жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","variants":[{"text":"Өндірістегі жазатайым оқиға: жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"Комиссия құрамының негізгі қағидасы: тергеудің объективтілігі мен жан-жақтылығын қамтамасыз ету.","image":null},{"text":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"Кемшілігі: пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null}],"image":null},{"id":238,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Репродуктивтік жүйеге әсер ететін заттар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Репродуктивтік жүйеге әсер ететін заттар: адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","variants":[{"text":"Репродуктивтік жүйеге әсер ететін заттар: адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","image":null},{"text":"Мемлекеттік еңбек инспекциясы: Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null},{"text":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"Өндірістік ортаның метеорологиялық жағдайы немесе микроклиматы: жұмыс аймағындағы адамның жылу алмасуына және жалпы жағдайына әсер ететін физикалық көрсеткіштердің жиынтығы.","image":null},{"text":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null}],"image":null},{"id":239,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жеке гигиена» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жеке гигиена: жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","variants":[{"text":"Жеке гигиена: жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null},{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Оқшаулау: жанғыш затты ауадағы оттегіден бөлу.","image":null},{"text":"Мутагендік заттар: ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"Өндірістік жарақат: жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null}],"image":null},{"id":240,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Оқшаулау» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Оқшаулау: жанғыш затты ауадағы оттегіден бөлу.","variants":[{"text":"Оқшаулау: жанғыш затты ауадағы оттегіден бөлу.","image":null},{"text":"Жеке қорғаныш құралдары: жұмыскерді зиянды және қауіпті өндірістік факторлардан қорғауға арналған арнайы құралдар.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null},{"text":"Алдын алу: еңбек заңнамасының бұзылуын, өндірістік жарақаттар мен кәсіптік тәуекелдерді олардың пайда болуына дейін төмендетуге бағытталған шаралар.","image":null},{"text":"Еңбек өтілі: жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null}],"image":null},{"id":241,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу: еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","variants":[{"text":"Жұмыс орнындағы жазатайым оқиғаларды дұрыс тіркеу және тергеу: еңбек қауіпсіздігін қамтамасыз етудің маңызды бөлігі.","image":null},{"text":"Г категориясы: жанбайтын заттар ыстық немесе балқыған күйде қолданылатын үй-жайлар","image":null},{"text":"Блокировка: қате немесе қауіпті әрекет жасалған кезде жабдықтың қосылуына немесе қауіпті бөлікке қол жеткізуге жол бермейтін құрылғы.","image":null},{"text":"Өндірістегі жұмыскерлердің өмірі мен денсаулығын сақтау: еңбек қауіпсіздігінің негізгі міндеттерінің бірі. Қауіпсіз еңбек жағдайларын қалыптастыру үшін өндірістегі қауіптерді алдын ала анықтап, олардың себептерін жою қажет.","image":null},{"text":"Ең маңызды қағида: өрт кезінде материалдық құндылықтарды емес, адамдардың өмірі мен қауіпсіздігін бірінші орынға қою.","image":null}],"image":null},{"id":242,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Импульстік шудың ерекшелігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Импульстік шудың ерекшелігі: дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","variants":[{"text":"Импульстік шудың ерекшелігі: дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","image":null},{"text":"Еңбек дауы: жұмыскер мен жұмыс беруші арасында еңбек заңнамасын, еңбек немесе ұжымдық шарт талаптарын орындауға байланысты туындайтын келіспеушілік.","image":null},{"text":"Үзілмелі шу: шу әсері белгілі бір уақыт аралығында тоқтап, кейін қайта пайда болады.","image":null},{"text":"Еңбек шарты: жұмыскер мен жұмыс берушінің арасындағы жазбаша келісім. Ол жұмыскердің атқаратын қызметін, еңбек жағдайларын, еңбекақысын және тараптардың міндеттерін белгілейді.","image":null},{"text":"Оқшаулау: жанғыш затты ауадағы оттегіден бөлу.","image":null}],"image":null},{"id":243,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Апаттық жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","variants":[{"text":"Апаттық жарықтандыру: негізгі жарықтандыру кенеттен сөнген кезде өндірістік процестің қауіпсіздігін қамтамасыз ету үшін қолданылады.","image":null},{"text":"Зиянды өндірістік фактор: ұзақ немесе белгілі бір деңгейде әсер еткен кезде жұмыскердің денсаулығының нашарлауына, ауруға немесе еңбекке қабілеттілігінің төмендеуіне әкелуі мүмкін фактор.","image":null},{"text":"Қауіпті өндірістік фактор: белгілі бір жағдайда жұмыскердің жарақат алуына немесе денсаулығына кенеттен зиян келуіне себеп болуы мүмкін фактор.","image":null},{"text":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null},{"text":"Еңбекті қорғаудың басты мақсаты: өндірістік жарақаттанудың, жазатайым оқиғалардың және кәсіптік аурулардың алдын алу, сондай-ақ әрбір жұмыскер үшін қауіпсіз және қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":244,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Кемшілігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Кемшілігі: пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","variants":[{"text":"Кемшілігі: пайдаланғаннан кейін ұнтақ жабдықтар мен бөлмені қатты ластайды.","image":null},{"text":"Табиғи желдетудің қарапайым түрі: терезелер, фрамугалар және арнайы желдету саңылаулары арқылы ауа алмасу.","image":null},{"text":"Биологиялық факторлар: адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Зиянды еңбек жағдайлары: жұмыскердің денсаулығына, еңбекке қабілеттілігіне кері әсер етуі мүмкін өндірістік жағдайлар.","image":null}],"image":null},{"id":245,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Электр тогымен зақымданған адамға көмек көрсетудегі бірінші міндет» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Электр тогымен зақымданған адамға көмек көрсетудегі бірінші міндет: оны ток әсерінен қауіпсіз босату.","variants":[{"text":"Электр тогымен зақымданған адамға көмек көрсетудегі бірінші міндет: оны ток әсерінен қауіпсіз босату.","image":null},{"text":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"Ең кең таралған тотықтырғыш: ауа құрамындағы оттегі. Кейбір заттардың жануы басқа тотықтырғыштардың қатысуымен де жүруі мүмкін.","image":null},{"text":"Тербелмелі шу: дыбыс деңгейі уақыт бойынша үздіксіз өзгеріп тұрады.","image":null},{"text":"Кәсіптік тәуекел: жұмыскердің еңбек міндеттерін орындауы кезінде қауіпті немесе зиянды өндірістік факторлардың әсерінен денсаулығына зиян келу ықтималдығы.","image":null}],"image":null},{"id":246,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Мемлекеттік және ішкі бақылаудың ортақ мақсаты» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Мемлекеттік және ішкі бақылаудың ортақ мақсаты: жұмыскердің өмірі мен денсаулығын сақтау.","variants":[{"text":"Мемлекеттік және ішкі бақылаудың ортақ мақсаты: жұмыскердің өмірі мен денсаулығын сақтау.","image":null},{"text":"Жеке қорғаныш құралдары: жұмыскердің денесін зиянды немесе қауіпті өндірістік факторлардың әсерінен қорғауға арналған құралдар.","image":null},{"text":"Еңбек өтілі: жұмыскердің еңбек қызметін жүзеге асырған уақыт кезеңі.","image":null},{"text":"Статикалық электр: материалдардың жанасуы, үйкелуі немесе бөлінуі кезінде олардың бетінде электр зарядтарының жиналуы.","image":null},{"text":"Өндірістік желдету: жұмыс орнындағы салауатты және қауіпсіз еңбек жағдайларын қамтамасыз етудің маңызды техникалық құралдарының бірі.","image":null}],"image":null},{"id":247,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Желдетудің негізгі міндеті» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Желдетудің негізгі міндеті: жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","variants":[{"text":"Желдетудің негізгі міндеті: жұмыс аймағынан шаңды, газдарды, буларды, аэрозольдерді, артық жылу мен ылғалды шығарып, таза ауамен қамтамасыз ету.","image":null},{"text":"Тітіркендіргіш заттар: көздің, мұрынның, ауыз қуысының, тыныс алу жолдарының және терінің шырышты қабықтарын тітіркендіреді.","image":null},{"text":"Өндірістік зияндылықтар: өндіріс жағдайында жұмыскерге жеке немесе бірлесіп әсер етіп, оның денсаулығына кері ықпал ететін өндірістік орта мен еңбек процесінің факторлары.","image":null},{"text":"Биологиялық факторлар: адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"Жарқ ету: жанғыш сұйықтық буының немесе газ қоспасының тұтандыру көзінің әсерінен қысқа мерзімді жануы.","image":null}],"image":null},{"id":248,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік жарақат» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік жарақат: жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","variants":[{"text":"Өндірістік жарақат: жұмыскердің еңбек қызметін атқару кезінде жазатайым оқиға салдарынан денсаулығына келтірілген зақым.","image":null},{"text":"Еңбек қауіпсіздігі: жұмыскерлерді зиянды және қауіпті өндірістік факторлардан қорғауды қамтамасыз ететін жағдай.","image":null},{"text":"Еңбекті қорғау жөніндегі техникалық инспектор: ұйымдағы еңбек қауіпсіздігі мен еңбекті қорғау жағдайына жұмыскерлер тарапынан бақылауға қатысатын өкіл.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Импульстік шудың ерекшелігі: дыбыс деңгейінің өте қысқа уақыт ішінде күрт жоғарылауы.","image":null}],"image":null},{"id":249,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Кәсіптік ауру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","variants":[{"text":"Кәсіптік ауру: жұмыскердің еңбек міндеттерін орындау барысында зиянды өндірістік факторлардың әсерінен пайда болатын ауру.","image":null},{"text":"Химиялық тежеу: арнайы өрт сөндіргіш заттардың көмегімен жану реакциясын баяулату немесе тоқтату.","image":null},{"text":"Импульстік шу: қысқа уақытқа созылатын жеке дыбыстық импульстерден тұрады.","image":null},{"text":"Гомогенді жану: жанғыш зат пен тотықтырғыш бір агрегаттық күйде болған жағдайда жүретін жану. Мысалы, газ қоспаларының жануы.","image":null},{"text":"Мұндай істердің мақсаты: оқиғаның барлық себептерін жан-жақты зерттеу және еңбек қауіпсіздігі талаптарының бұзылуына жол берген себептерді анықтау.","image":null}],"image":null},{"id":250,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Биологиялық факторлар» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Биологиялық факторлар: адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","variants":[{"text":"Биологиялық факторлар: адам денсаулығына әсер етуі мүмкін микроорганизмдер, биологиялық объектілер және олардың тіршілік әрекеті нәтижесінде түзілетін өнімдер.","image":null},{"text":"Өндірістік желдету: жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null},{"text":"Мемлекеттік еңбек инспекциясы: Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null},{"text":"Қауіпсіз еңбек жағдайын қамтамасыз етудің маңызды шараларының бірі: жұмыскерлерді еңбек қауіпсіздігі бойынша оқыту.","image":null},{"text":"Жеке гигиена: жұмыскердің өзінің денсаулығын сақтауға бағытталған күнделікті санитариялық шаралары.","image":null}],"image":null},{"id":251,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік санитария мен еңбек гигиенасының негізгі міндеті» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","variants":[{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null},{"text":"Ішкі бақылаудың мақсаты: қауіпті жағдайларды жазатайым оқиға болғанға дейін анықтау және жою.","image":null},{"text":"Өздігінен жану: сыртқы ашық тұтандыру көзінсіз зат ішінде жүретін процестер нәтижесінде температураның жоғарылап, жанудың басталуы.","image":null},{"text":"Жеке қорғану құралдары: адамның ағзасын өндірістік ортаның қауіпті және зиянды факторларының әсерінен қорғауға арналған арнайы құралдар мен бұйымдар. Олар жұмысшының денсаулығын сақтауға, өндірістік жарақаттар мен кәсіптік аурулардың алдын алуға мүмкіндік береді.","image":null},{"text":"Өрт байқалған жағдайда ең басты міндет: адамдардың өмірін қорғау және өрт туралы шұғыл хабарлау.","image":null}],"image":null},{"id":252,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Жанғыш ортаны азайту» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Жанғыш ортаны азайту: жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","variants":[{"text":"Жанғыш ортаны азайту: жанғыш заттардың немесе газдардың өрт ошағына берілуін тоқтату.","image":null},{"text":"Мутагендік заттар: ағзадағы генетикалық материалға кері әсер етуі мүмкін.","image":null},{"text":"Жарылыс: энергияның өте қысқа уақыт ішінде бөлінуімен, қысымның күрт жоғарылауымен және соққы толқынының пайда болуымен жүретін процесс.","image":null},{"text":"Электр қауіпсіздігі: электр тогының, электр доғасының, электр және электромагниттік өрістердің адамға қауіпті және зиянды әсерінен қорғауды қамтамасыз ететін ұйымдастырушылық және техникалық шаралар мен құралдар жүйесі.","image":null},{"text":"Мемлекеттік еңбек инспекторы: еңбек заңнамасының сақталуына мемлекеттік бақылауды жүзеге асыратын лауазымды тұлға.","image":null}],"image":null},{"id":253,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","variants":[{"text":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"Жұмыс орнын рационалды жарықтандыру: қауіпсіз және өнімді еңбек жағдайларын қалыптастыратын негізгі өндірістік факторлардың бірі.","image":null},{"text":"Кәсіптік ауру: жұмыскерге еңбек қызметі барысында зиянды өндірістік факторлардың әсер етуінен туындаған ауру.","image":null},{"text":"Стробоскопиялық әсер: периодты түрде өзгеріп тұратын жарық әсерінен қозғалыстағы немесе айналып тұрған бөлшектің қозғалысы көзге баяулаған, тоқтап тұрған немесе басқа бағытта қозғалып жатқандай көрінетін құбылыс.","image":null},{"text":"Еңбек гигиенасы мен өндірістік санитарияның негізгі мақсаты: жұмыскердің денсаулығын сақтау, кәсіптік аурулардың алдын алу және жұмыс орнында қауіпсіз әрі қолайлы еңбек жағдайларын қалыптастыру.","image":null}],"image":null},{"id":254,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Діріл» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","variants":[{"text":"Діріл: машиналардың, механизмдердің немесе олардың бөлшектерінің механикалық тербелмелі қозғалысы.","image":null},{"text":"Өндірістік жарақаттанушылық: белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"Жазатайым оқиға: қызметкердің еңбек міндеттерін орындау барысында немесе жұмыс берушінің тапсырмасын орындау кезінде денсаулығына зиян келуіне, жарақат алуына, еңбекке қабілеттілігін жоғалтуына немесе қайтыс болуына алып келген оқиға.","image":null},{"text":"Оқиға орнын зерттеу: тергеудің маңызды кезеңдерінің бірі.","image":null},{"text":"Химиялық факторлар: өндірісте қолданылатын немесе технологиялық процесс барысында пайда болатын химиялық заттардың адам ағзасына зиянды әсер етуімен байланысты факторлар.","image":null}],"image":null},{"id":255,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Эвакуациялық жарықтандыру» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Эвакуациялық жарықтандыру: апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","variants":[{"text":"Эвакуациялық жарықтандыру: апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Өндірістік санитария мен еңбек гигиенасының негізгі міндеті: жұмыскерлердің денсаулығын сақтау және өндірістік ортаның зиянды факторларының әсерін болдырмау немесе азайту.","image":null},{"text":"Қауіпті және зиянды факторларды анықтау: еңбек қауіпсіздігін қамтамасыз етудің алғашқы кезеңдерінің бірі. Фактор анықталғаннан кейін оның жұмыскерге әсер ету ықтималдығы мен салдарының ауырлығы бағаланып, тиісті қорғану шаралары белгіленеді.","image":null},{"text":"Әлеуметтік әріптестік: жұмыскерлер, жұмыс берушілер және олардың өкілдері арасындағы еңбек қатынастарындағы мүдделерді келісуге бағытталған өзара іс-қимыл жүйесі.","image":null}],"image":null},{"id":256,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Оның маңызды ерекшелігі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Оның маңызды ерекшелігі: барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","variants":[{"text":"Оның маңызды ерекшелігі: барлық спринклерлердің бір уақытта ашылуы міндетті емес. Әдетте қажетті аймақтағы қызған спринклерлер іске қосылады.","image":null},{"text":"Жұмыс орнында қауіпсіз жағдай жасау: жұмыс берушінің негізгі міндеттерінің бірі.","image":null},{"text":"Жұмыс орнын рационалды жарықтандыру: қауіпсіз және өнімді еңбек жағдайларын қалыптастыратын негізгі өндірістік факторлардың бірі.","image":null},{"text":"Қауіпті және зиянды факторларды анықтау: еңбек қауіпсіздігін қамтамасыз етудің алғашқы кезеңдерінің бірі. Фактор анықталғаннан кейін оның жұмыскерге әсер ету ықтималдығы мен салдарының ауырлығы бағаланып, тиісті қорғану шаралары белгіленеді.","image":null},{"text":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null}],"image":null},{"id":257,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Қазақстанда жедел жәрдем нөмірі» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Қазақстанда жедел жәрдем нөмірі: 103, бірыңғай шұғыл қызмет – 112.","variants":[{"text":"Қазақстанда жедел жәрдем нөмірі: 103, бірыңғай шұғыл қызмет – 112.","image":null},{"text":"Репродуктивтік жүйеге әсер ететін заттар: адамның ұрпақ өрбіту қызметіне теріс әсер етуі мүмкін.","image":null},{"text":"Қауіпті және зиянды факторларды анықтау: еңбек қауіпсіздігін қамтамасыз етудің алғашқы кезеңдерінің бірі. Фактор анықталғаннан кейін оның жұмыскерге әсер ету ықтималдығы мен салдарының ауырлығы бағаланып, тиісті қорғану шаралары белгіленеді.","image":null},{"text":"Аралас табиғи жарықтандыру: шеткі және жоғарғы жарықтандыру бірге пайдаланылады.","image":null},{"text":"Өндірістік ортадағы еңбек жағдайын қалыптастыратын маңызды факторлардың бірі: жұмыс орнын дұрыс жарықтандыру. Жарықтандыру адамның көру қабілетіне, еңбек өнімділігіне, жұмыс сапасына және өндірістік қауіпсіздікке тікелей әсер етеді.","image":null}],"image":null},{"id":258,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Еңбек инспекциясының негізгі бағыттары» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Еңбек инспекциясының негізгі бағыттары: мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","variants":[{"text":"Еңбек инспекциясының негізгі бағыттары: мемлекеттік бақылау және алдын алу. Заң бұзушылық анықталған жағдайда оны жою шаралары қабылданады, ал профилактикалық жұмыстар өндірістік жарақаттар мен еңбек құқықтарының бұзылуына жол бермеуге бағытталады.","image":null},{"text":"Еңбек міндеттері: жұмыскер мен жұмыс берушінің заңнамада, еңбек шартында және басқа да құжаттарда белгіленген міндеттері.","image":null},{"text":"Дыбыс жиілігі: дыбыс тербелісінің бір секундтағы саны. Ол герцпен (Гц) өлшенеді.","image":null},{"text":"Эвакуациялық жарықтандыру: апат немесе төтенше жағдай кезінде адамдардың ғимараттан қауіпсіз шығуына мүмкіндік береді.","image":null},{"text":"Қауіпсіздік мәдениеті: кәсіпорындағы әрбір адамның қауіпсіздікті күнделікті жұмыстың ажырамас бөлігі ретінде қабылдауы.","image":null}],"image":null},{"id":259,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік желдету» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік желдету: жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","variants":[{"text":"Өндірістік желдету: жұмыс бөлмелеріндегі ауаның қажетті санитариялық-гигиеналық параметрлерін қамтамасыз етуге арналған ұйымдастырушылық және техникалық шаралар мен құрылғылар жүйесі.","image":null},{"text":"Олардың артықшылығы: қоршаған ауа құрамына тәуелділігінің аз болуы. Мұндай құралдар оттегі жеткіліксіз немесе құрамы белгісіз қауіпті ортада арнайы дайындықтан өткен қызметкерлермен пайдаланылады.","image":null},{"text":"Өндірістегі жазатайым оқиға: жұмыскердің еңбек міндеттерін орындау барысында жарақат алуына немесе денсаулығына басқа да зақым келуіне байланысты оқиға.","image":null},{"text":"Желдетудің негізгі мақсаты: жұмыс аймағынан артық жылуды, ылғалды, шаңды, газды, буды және басқа зиянды заттарды шығарып, олардың орнына таза ауа беру.","image":null},{"text":"Мемлекеттік еңбек инспекциясы: Қазақстан Республикасының еңбек заңнамасының сақталуын бақылауға, жұмыскерлердің еңбек құқықтарын қорғауға және қауіпсіз еңбек жағдайларын қамтамасыз етуге бағытталған мемлекеттік бақылау жүйесі.","image":null}],"image":null},{"id":260,"question":"Еңбекті қорғау шараларын жоспарлау кезінде «Өндірістік жарақаттанушылық» ұғымын дәл қолдану қажет. Төмендегі тұжырымдардың қайсысы дәрістегі анықтамаға сәйкес?","correct":"Өндірістік жарақаттанушылық: белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","variants":[{"text":"Өндірістік жарақаттанушылық: белгілі бір кәсіпорында, салада немесе уақыт аралығында болған өндірістік жарақаттардың жиынтығы.","image":null},{"text":"Тергеудің мақсаты тек кінәлі адамды анықтау емес. Ең басты мақсат: жазатайым оқиғаның нақты себептерін анықтау, еңбек қауіпсіздігі жүйесіндегі кемшіліктерді жою және осындай жағдайдың қайталануына жол бермеу.","image":null},{"text":"Негізгі мақсат: қауіп-қатерді мүмкіндігінше жою, ал толық жою мүмкін болмаса, оның деңгейін қолайлы шекке дейін төмендету.","image":null},{"text":"Ауа температурасы: өндірістік микроклиматтың негізгі көрсеткіштерінің бірі.","image":null},{"text":"Әлеуметтік әріптестік: жұмыскерле
